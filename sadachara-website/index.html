े सरस्वती ।", "करमूले सदा गौरी प्रभाते करदर्शनम् ॥"], "iast": ["karāgre vasate lakṣmīḥ karamadhye sarasvatī ।", "karamūle sadā gaurī prabhāte karadarśanam ॥"], "meaning": "At the tips of the hands dwells Lakṣmī, in the middle Sarasvatī, and at the base (where it joins the wrist) Gaurī (Pārvatī); therefore in the morning one should look upon one's hands.", "action": "On waking, spread the palms, join them, and meditate on Lakṣmī at the fingertips, Sarasvatī in the middle, and Gaurī at the base of the palms, then look at the hands. Afterwards: cleanse the body, brush the teeth, wash the face, water the tulasī plant, and circumambulate while chanting.", "audio": "audio/006-karagre-vasate-lakshmih.wav", "cat": "morning"}, {"id": 7, "slug": "tulasi-srisakhi", "title": "Tulasi Śrīsakhi", "chapter": "Prātaḥsnānātpūrvakarma — Rituals before the morning bath", "book_page": "3", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["तुलसि श्रीसखि शुभे पापहारिणि पुण्यदे ।", "नमस्ते नारदनुते नारायण मनःप्रिये ॥"], "iast": ["tulasi śrīsakhi śubhe pāpahāriṇi puṇyade ।", "namaste nāradanute nārāyaṇa manaḥpriye ॥"], "meaning": "O Tulasī, friend of Śrī (Lakṣmī), auspicious one, remover of sins, giver of merit; salutations to you, praised by Nārada, beloved of the mind of Nārāyaṇa.", "action": "Perform namaskāra to the tulasī plant and apply tulasī *mṛttikā* (mud) to the forehead, then feed grass to the cows and perform namaskāra to the cows (chanting the next verse).", "audio": "audio/007-tulasi-srisakhi.wav", "cat": "morning"}, {"id": 8, "slug": "sarvakamadughe-devi", "title": "Sarvakāmadughe Devi (Surabhi / Cow prayer)", "chapter": "Prātaḥsnānātpūrvakarma — Rituals before the morning bath", "book_page": "3", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["सर्वकामदुघे देवि सर्वतीर्थाभिषेचिनि ।", "पावनि सुरभे श्रेष्ठे देवि तुभ्यं नमोऽस्तु ते ॥"], "iast": ["sarvakāmadughe devi sarvatīrthābhiṣecini ।", "pāvani surabhe śreṣṭhe devi tubhyaṃ namo'stu te ॥"], "meaning": "O Goddess (cow) who yields all desires, in whom all sacred waters bathe; O purifying one, O excellent Surabhi, O Goddess, salutations to you.", "action": "Perform namaskāra to the cows. Then chant the *Gajendra Mokṣa* and the *Maṅgalāṣṭaka*, read the *pañcāṅga* (almanac). The bath follows.", "audio": "audio/008-sarvakamadughe-devi.wav", "cat": "morning"}, {"id": 9, "slug": "tvam-raja-sarva-tirthanam", "title": "Tvaṃ Rājā Sarva Tīrthānāṃ", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "3", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["त्वं राजा सर्व तीर्थानां त्वमेव जगतः पिता ।", "याचितं देहि मे तीर्थं सर्वपापप्रमोचनम् ॥"], "iast": ["tvaṃ rājā sarva tīrthānāṃ tvameva jagataḥ pitā ।", "yācitaṃ dehi me tīrthaṃ sarvapāpapramocanam ॥"], "meaning": "You are the king of all sacred waters (tīrthas); you alone are the father of the world. Grant me, as I beg, the holy water that releases from all sins.", "action": "To begin the bath, first chant *tīrtharājāya namaḥ* and pay obeisance to Lord Varuṇa, then recite this verse.", "audio": "audio/009-tvam-raja-sarva-tirthanam.wav", "cat": "morning"}, {"id": 10, "slug": "nandini-nalini-ganga-dvadasanama", "title": "Nandinī Nalinī — Twelve Names of Gaṅgā", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "4", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["नन्दिनी नलिनी सीता मालती च मलापहा ।", "विष्णुपादाब्जसम्भूता गङ्गा त्रिपथगामिनि ॥", "भागीरथी भोगवती जाह्नवी त्रिदशेश्वरी ।", "द्वादशैतानि नामानि यत्र यत्र जलाशये ॥", "स्नानकाले पठेन्नित्यं तत्र तत्र वसाम्यहम् ॥"], "iast": ["nandinī nalinī sītā mālatī ca malāpahā ।", "viṣṇupādābjasambhūtā gaṅgā tripathagāmini ॥", "bhāgīrathī bhogavatī jāhnavī tridaśeśvarī ।", "dvādaśaitāni nāmāni yatra yatra jalāśaye ॥", "snānakāle paṭhennityaṃ tatra tatra vasāmyaham ॥"], "meaning": "Nandinī, Nalinī, Sītā, Mālatī, Malāpahā (remover of impurity), Viṣṇupādābja-sambhūtā (born of the lotus-foot of Viṣṇu), Gaṅgā, Tripathagāminī (flowing in three paths), Bhāgīrathī, Bhogavatī, Jāhnavī, Tridaśeśvarī — \"[Gaṅgā says:] wherever, in whatever body of water, one daily recites these twelve names of mine at the time of bathing, there I am present.\"", "action": "If these twelve names of Gaṅgā are chanted, Gaṅgā becomes present in the bathing water. When bathing in a river, stand facing the direction from which the water flows; the water should reach up to the navel. Unloose the tuft of hair, hold the breath, and dip the head and then the back three times.\n\n> *Ritual notes from this section: One should not bathe in fire-heated water when healthy — `वह्निसप्ताम्बुना स्नातो नाप्नोति स्नानजं फलम्` (vahnitaptāmbunā snāto nāpnoti snānajaṃ phalam: \"one who bathes in hot water does not obtain the merit of the bath\"). If ill and forced to use hot water, fill the bucket with a little cold water, then hot, then cold again, and bathe while touching the water and chanting \"gaṅge ca yamune caiva…\". If seriously ill, rub the body with a wet cloth, perform ācamana, and sprinkle water on the body chanting the \"āpohiṣṭhā…\" mantra.*", "audio": "audio/010-nandini-nalini-ganga-dvadasanama.wav", "cat": "morning"}, {"id": 11, "slug": "gange-ca-yamune", "title": "Gaṅge Ca Yamune (Seven Rivers Invocation)", "chapter": "Snāna vidhiḥ — Method of bathing (Saṅkalpa)", "book_page": "5", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["गङ्गे च यमुने चैव गोदावरि सरस्वति ।", "नर्मदे सिन्धु कावेरि जलेऽस्मिन् सन्निधिं कुरु ॥"], "iast": ["gaṅge ca yamune caiva godāvari sarasvati ।", "narmade sindhu kāveri jale'smin sannidhiṃ kuru ॥"], "meaning": "O Gaṅgā and Yamunā, O Godāvarī, Sarasvatī, Narmadā, Sindhu and Kāverī — be present in this water.", "action": "After the dip, perform ācamana, then the saṅkalpa: invoke the seven sacred rivers into the bathing water with this verse. (The full deśa-kāla saṅkalpa formula — \"govinda govinda… adya brahmaṇaḥ dvitīya-parārdhe…\" — follows in the book as a prose declaration of place, time and intent.)", "audio": "audio/011-gange-ca-yamune.wav", "cat": "morning"}, {"id": 12, "slug": "namah-kamalanabhaya", "title": "Namaḥ Kamalanābhāya (Arghya to Viṣṇu)", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "7", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["नमः कमलनाभाय नमस्ते जलशायिने ।", "नमस्तेऽस्तु हृषीकेश गृहाणार्घ्यं नमोऽस्तु ते ॥"], "iast": ["namaḥ kamalanābhāya namaste jalaśāyine ।", "namaste'stu hṛṣīkeśa gṛhāṇārghyaṃ namo'stu te ॥"], "meaning": "Salutations to the lotus-naveled one, salutations to the one who reclines upon the waters; salutations to you, O Hṛṣīkeśa — accept this arghya, salutations to you.", "action": "Chant the *dvādaśanāma* (Keśava, Nārāyaṇa, etc.), invoke the presence of *gopīcandana* in the water, and apply the twelve nāmas on the body. Then, chanting this mantra, offer arghya (water oblation) to Lord Viṣṇu.", "audio": "audio/012-namah-kamalanabhaya.wav", "cat": "morning"}, {"id": 13, "slug": "ehi-surya-sahasramsho", "title": "Ehi Sūrya Sahasrāṃśo (Arghya to Sūrya)", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "7", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["एहि सूर्य सहस्रांशो तेजोराशे जगत्पते ।", "अनुकम्पय मां नित्यं गृहाणार्घ्यं नमोऽस्तु ते ॥"], "iast": ["ehi sūrya sahasrāṃśo tejorāśe jagatpate ।", "anukampaya māṃ nityaṃ gṛhāṇārghyaṃ namo'stu te ॥"], "meaning": "Come, O Sūrya of a thousand rays, O mass of splendour, O Lord of the world; ever show me compassion — accept this arghya, salutations to you.", "action": "Chanting this mantra, offer arghya to Sūryadeva.", "audio": "audio/013-ehi-surya-sahasramsho.wav", "cat": "morning"}, {"id": 14, "slug": "brahmakamandalu-sambhute", "title": "Brahmakamaṇḍalu-sambhūte (Arghya to Gaṅgā)", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "7", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ब्रह्मकमण्डलुसम्भूते पूर्णचन्द्रनिभानने ।", "त्रैलोक्यवन्दिते गङ्गे गृहाणार्घ्यं नमोऽस्तु ते ॥"], "iast": ["brahmakamaṇḍalusambhūte pūrṇacandranibhānane ।", "trailokyavandite gaṅge gṛhāṇārghyaṃ namo'stu te ॥"], "meaning": "O Gaṅgā, born from the water-pot of Brahmā, whose face resembles the full moon, revered by the three worlds — accept this arghya, salutations to you.", "action": "Offer arghya to Gaṅgā with this mantra. While bathing in a river, chant the river's *abhimānidevatā* mantra; if not known, utter the river's name and say \"*tadantaryāmi nārāyaṇa idam arghyam*\" (e.g. *kāveryantargata nārāyaṇa…*).", "audio": "audio/014-brahmakamandalu-sambhute.wav", "cat": "morning"}, {"id": 15, "slug": "uddhrtasi-varahena", "title": "Uddhṛtāsi Varāheṇa (Mṛttikā mantra)", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "8", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["उद्धृतासि वराहेण कृष्णेन शतबाहुना ।", "मृत्तिके हन मे पापं यन्मया दुष्कृतं कृतम् ॥"], "iast": ["uddhṛtāsi varāheṇa kṛṣṇena śatabāhunā ।", "mṛttike hana me pāpaṃ yanmayā duṣkṛtaṃ kṛtam ॥"], "meaning": "O Bhūdevī (sacred earth), you were raised up by Kṛṣṇa in the form of the hundred-armed Boar (Varāha). O mṛttikā, destroy my sin — whatever wrong has been done by me.", "action": "Chanting this mantra, rub *mṛttikā* (sacred earth/clay) all over the body. Then utter loudly \"*gaṅge māṃ punīhi*\" (गङ्गे मां पुनीहि — \"O Gaṅgā, purify me\"). On Ekādaśī, arghya should be offered only to Lord Viṣṇu.", "audio": "audio/015-uddhrtasi-varahena.wav", "cat": "morning"}, {"id": 16, "slug": "om-namo-bhagavate-three-mantras", "title": "Oṃ Namo Bhagavate — Three Dip Mantras", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "8", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं ओं नमो भगवते वासुदेवाय ओं ।", "ओं ओं नमो नारायणाय ओं ।", "ओं विष्णवे नमः ओं ॥"], "iast": ["oṃ oṃ namo bhagavate vāsudevāya oṃ ।", "oṃ oṃ namo nārāyaṇāya oṃ ।", "oṃ viṣṇave namaḥ oṃ ॥"], "meaning": "Oṃ, salutations to the Lord Vāsudeva; Oṃ, salutations to Nārāyaṇa; Oṃ, salutations to Viṣṇu.", "action": "Chanting these three mantras, take a dip three times (one per mantra). Then, chanting the \"*āpohiṣṭhā…*\" mantra, sprinkle water on the body.", "audio": "audio/016-om-namo-bhagavate-three-mantras.wav", "cat": "morning"}, {"id": 17, "slug": "aghamarshana-sukta", "title": "Aghamarṣaṇa Sūkta (Ṛtaṃ ca satyaṃ)", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "8", "meter": "anuṣṭubh", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं ऋतं च सत्यं चाभीद्धात् तपसोऽध्यजायत ।", "ततो रात्र्यजायत ततः समुद्रो अर्णवः ॥", "समुद्रादर्णवादधि संवत्सरो अजायत ।", "अहोरात्राणि विदधद् विश्वस्य मिषतो वशी ॥", "सूर्याचन्द्रमसौ धाता यथापूर्वमकल्पयत् ।", "दिवं च पृथिवीं चान्तरिक्षमथो स्वः ॥"], "iast": ["oṃ ṛtaṃ ca satyaṃ cābhīddhāt tapaso'dhyajāyata ।", "tato rātryajāyata tataḥ samudro arṇavaḥ ॥", "samudrādarṇavādadhi saṃvatsaro ajāyata ।", "ahorātrāṇi vidadhad viśvasya miṣato vaśī ॥", "sūryācandramasau dhātā yathāpūrvamakalpayat ।", "divaṃ ca pṛthivīṃ cāntarikṣamatho svaḥ ॥"], "meaning": "From the kindled tapas (austerity) were born *ṛta* (cosmic order) and *satya* (truth); thence was born night, thence the surging ocean. From the surging ocean was born the year, ordaining days and nights, the controller of all that blinks (lives). The Creator (Dhātṛ) fashioned the sun and the moon as before, and the heaven, the earth, the mid-region, and the realm of light.", "action": "The *Aghamarṣaṇa* (sin-effacing) sūkta — *ṛṣi*: Aghamarṣaṇa; *chandas*: Anuṣṭup; *devatā*: Nārāyaṇa the creator. Recited while standing in the bathing water.", "audio": null, "cat": "morning"}, {"id": 18, "slug": "ye-ke-casmatkule-jata", "title": "Ye Ke Cāsmatkule Jātā (Keśaniṣpīḍana tarpaṇa)", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "11", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ये के चास्मत्कुले जाता अपुत्रा गोत्रिणो मृताः ।", "ते गृह्णन्तु मया दत्तं केशनिष्पीडनोदकम् ॥"], "iast": ["ye ke cāsmatkule jātā aputrā gotriṇo mṛtāḥ ।", "te gṛhṇantu mayā dattaṃ keśaniṣpīḍanodakam ॥"], "meaning": "Whoever in our family have been born and died sonless, of our gotra — may they accept this water, wrung from my (wet) hair and offered by me.", "action": "Offer the water squeezed from the wet hair (*keśaniṣpīḍana*) as tarpaṇa to ancestors who died without sons. (Preceding tarpaṇa: facing east, offer one tarpaṇa to the devatās of the three worlds from the fingertips; shifting the yajñopavīta over the chest and facing north, offer two to the ṛṣis from the base of the little finger; shifting it to the right shoulder and facing south, offer three to the pitṛs from the base of the thumb.)", "audio": "audio/018-ye-ke-casmatkule-jata.wav", "cat": "morning"}, {"id": 19, "slug": "ye-ke-casmatkule-vastra", "title": "Ye Ke Cāsmatkule Jātā (Vastra-niṣpīḍana variant)", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "11", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ये के चास्मत्कुले जाता अपुत्रा गोत्रिणो मृताः ।", "ते गृह्णन्तु मया दत्तं वस्त्रनिष्पीडनोदकम् ॥"], "iast": ["ye ke cāsmatkule jātā aputrā gotriṇo mṛtāḥ ।", "te gṛhṇantu mayā dattaṃ vastraniṣpīḍanodakam ॥"], "meaning": "Whoever in our family have been born and died sonless, of our gotra — may they accept this water, wrung from my (wet) cloth and offered by me.", "action": "The companion to the previous verse: first shift the tuft of hair to the right and offer the hair-water tarpaṇa to the pitṛ-devatā (Aryamā) and the sonless ancestors, remembering Sri Hari throughout; then, wearing the yajñopavīta like a garland, offer this cloth-water (*vastra-niṣpīḍana*) tarpaṇa.", "audio": "audio/019-ye-ke-casmatkule-vastra.wav", "cat": "morning"}, {"id": 20, "slug": "yanmaya-dushitam-toyam", "title": "Yanmayā Dūṣitaṃ Toyaṃ (Yakṣma tarpaṇa)", "chapter": "Snāna vidhiḥ — Method of bathing", "book_page": "12", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["यन्मया दूषितं तोयं शरीरमलसम्भवम् ।", "तत्पापशोधनार्थाय यक्ष्माणं तर्पयाम्यहम् ॥"], "iast": ["yanmayā dūṣitaṃ toyaṃ śarīramalasambhavam ।", "tatpāpaśodhanārthāya yakṣmāṇaṃ tarpayāmyaham ॥"], "meaning": "Whatever water I have polluted with the dirt born of my body — to cleanse that sin, I offer tarpaṇa to Yakṣma.", "action": "Since bathing in the rivers washes off bodily dirt and so pollutes the holy waters, as expiation offer tarpaṇa once (*yakṣma tarpaṇa*) to any block of stone nearby, chanting this mantra. Conclude the bath with the dedication: \"*anena puṇyatīrthasnānena bhagavān … śrī Gopālakṛṣṇaḥ prīyatām*\" (may Lord Gopālakṛṣṇa be pleased by this bathing in the holy waters).", "audio": "audio/020-yanmaya-dushitam-toyam.wav", "cat": "morning"}, {"id": 21, "slug": "ishaddhautam-navam-svetam", "title": "Īṣaddhautaṃ Navaṃ Śvetaṃ", "chapter": "Vastradhāraṇavidhiḥ — Method of wearing clothes", "book_page": "12", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ईषद्धौतं नवं श्वेतं सदशं यन्नधारितम् ।", "अहतं तद्द्विजानीयात् सर्वकर्मसु शोभनम् ॥"], "iast": ["īṣaddhautaṃ navaṃ śvetaṃ sadaśaṃ yannadhāritam ।", "ahataṃ taddvijānīyāt sarvakarmasu śobhanam ॥"], "meaning": "A cloth lightly washed, new, white, with its fringe (border) intact, and not previously worn — that should be known as *ahata* (unworn), and it is auspicious for all rites.", "action": "After drying the body, wear the *kaccha* and offer the snāna-karma to the Lord with the dedication mantra. This verse describes the proper (*ahata*) garment to wear for ritual.", "audio": "audio/021-ishaddhautam-navam-svetam.wav", "cat": "morning"}, {"id": 22, "slug": "dharanad-urdhvapundrasya", "title": "Dhāraṇād Ūrdhvapuṇḍrasya", "chapter": "Gopīcandanadhāraṇam — Applying gopīcandana", "book_page": "13", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["धारणाद् ऊर्ध्वपुण्ड्रस्य शरीरं मन्दिरं हरेः ।"], "iast": ["dhāraṇād ūrdhvapuṇḍrasya śarīraṃ mandiraṃ hareḥ ।"], "meaning": "By wearing the *ūrdhvapuṇḍra* (vertical mark), the body becomes the temple of Hari. The marks (*nāmas*) indicate that the human body belongs to the Lord, is His abode, and is ever under His possession.", "action": "Perform ācamana and apply gopīcandana with *nirmālyatīrtha*, chanting this mantra.", "audio": "audio/022-dharanad-urdhvapundrasya.wav", "cat": "morning"}, {"id": 23, "slug": "gopichandana-papaghna", "title": "Gopīcandana Pāpaghna", "chapter": "Gopīcandanadhāraṇam — Applying gopīcandana", "book_page": "14", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["गोपीचन्दन पापघ्न विष्णुदेहसमुद्भव ।", "चक्राङ्कित नमस्तेऽस्तु धारणान्मुक्तिदो भव ॥"], "iast": ["gopīcandana pāpaghna viṣṇudehasamudbhava ।", "cakrāṅkita namaste'stu dhāraṇānmuktido bhava ॥"], "meaning": "O gopīcandana, destroyer of sin, born from the body of Viṣṇu, marked with the discus — salutations to you; by your being worn, become the giver of liberation.", "action": "Recited while applying the gopīcandana before marking the twelve nāmas on the body.", "audio": "audio/023-gopichandana-papaghna.wav", "cat": "morning"}, {"id": 24, "slug": "lalate-kesavam-dvadasanama-nyasa", "title": "Lalāṭe Keśavaṃ — Twelve-Nāma Placement", "chapter": "Gopīcandanadhāraṇam — Applying gopīcandana", "book_page": "14", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ललाटे केशवं विद्यात् नारायणमथोदरे ।", "माधवं हृदये विद्यात् गोविन्दं कण्टकूबरे ॥", "उदरे दक्षिणे पार्श्वे विष्णुं विद्यात् विचक्षणः ।", "तत्पार्श्वे बाहुमूले तु धारयेत् मधुसूदनम् ॥", "त्रिविक्रमं कण्ठदेशे वामपार्श्वे तु वामनम् ।", "श्रीधरं वामबाहौ तु हृषीकेशं गले लिखेत् ॥", "पृष्ठे तु पद्मनाभं तु ककुद्दामोदरं न्यसेत् ।", "वासुदेवेति मूर्धनि ॥"], "iast": ["lalāṭe keśavaṃ vidyāt nārāyaṇamathodare ।", "mādhavaṃ hṛdaye vidyāt govindaṃ kaṇṭakūbare ॥", "udare dakṣiṇe pārśve viṣṇuṃ vidyāt vicakṣaṇaḥ ।", "tatpārśve bāhumūle tu dhārayet madhusūdanam ॥", "trivikramaṃ kaṇṭhadeśe vāmapārśve tu vāmanam ।", "śrīdharaṃ vāmabāhau tu hṛṣīkeśaṃ gale likhet ॥", "pṛṣṭhe tu padmanābhaṃ tu kakuddāmodaraṃ nyaset ।", "vāsudeveti mūrdhani ॥"], "meaning": "One should know Keśava on the forehead, Nārāyaṇa on the belly, Mādhava on the heart, Govinda at the throat-hollow; the wise should place Viṣṇu on the right side of the belly, Madhusūdana on the root of the (right) arm; Trivikrama at the throat region, Vāmana on the left side, Śrīdhara on the left arm, Hṛṣīkeśa marked on the neck; Padmanābha on the back, Dāmodara on the nape, and Vāsudeva on the head.", "action": "The placement (*nyāsa*) of the twelve ūrdhvapuṇḍra marks with their presiding nāmas on the corresponding parts of the body.", "audio": "audio/024-lalate-kesavam-dvadasanama-nyasa.wav", "cat": "morning"}, {"id": 25, "slug": "dvadasanama-namaskara-mantras", "title": "Dvādaśanāma Namaskāra Mantras", "chapter": "Gopīcandanadhāraṇam — Applying gopīcandana", "book_page": "15", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ॐ वासुदेवाय नमः ।", "ॐ केशवाय नमः ।", "ॐ नारायणाय नमः ।", "ॐ माधवाय नमः ।", "ॐ गोविन्दाय नमः ।", "ॐ विष्णवे नमः ।", "ॐ मधुसूदनाय नमः ।", "ॐ त्रिविक्रमाय नमः ।", "ॐ वामनाय नमः ।", "ॐ श्रीधराय नमः ।", "ॐ हृषीकेशाय नमः ।", "ॐ पद्मनाभाय नमः ।", "ॐ दामोदराय नमः ॥"], "iast": ["oṃ vāsudevāya namaḥ ।", "oṃ keśavāya namaḥ ।", "oṃ nārāyaṇāya namaḥ ।", "oṃ mādhavāya namaḥ ।", "oṃ govindāya namaḥ ।", "oṃ viṣṇave namaḥ ।", "oṃ madhusūdanāya namaḥ ।", "oṃ trivikramāya namaḥ ।", "oṃ vāmanāya namaḥ ।", "oṃ śrīdharāya namaḥ ।", "oṃ hṛṣīkeśāya namaḥ ।", "oṃ padmanābhāya namaḥ ।", "oṃ dāmodarāya namaḥ ॥"], "meaning": "Salutations to the twelve forms of the Lord — Vāsudeva, Keśava, Nārāyaṇa, Mādhava, Govinda, Viṣṇu, Madhusūdana, Trivikrama, Vāmana, Śrīdhara, Hṛṣīkeśa, Padmanābha and Dāmodara.", "action": "Apply the nāma with the forefinger on each body-part as each mantra is chanted: Vāsudeva on the crown; Keśava on the forehead (from the edge of the nose, with a gap in the middle); Nārāyaṇa on the middle of the stomach; Mādhava on the chest; Govinda at the middle of the throat; Viṣṇu on the right of the stomach; Madhusūdana on the right forearm; Trivikrama on the right of the neck; Vāmana on the left of the stomach; Śrīdhara on the left forearm; Hṛṣīkeśa on the left of the neck; Padmanābha on the middle of the back; Dāmodara on the back of the neck.", "audio": "audio/025-dvadasanama-namaskara-mantras.wav", "cat": "morning"}, {"id": 26, "slug": "krsnapaksa-namaskara-mantras", "title": "Kṛṣṇapakṣa Namaskāra Mantras", "chapter": "Gopīcandanadhāraṇam — Applying gopīcandana", "book_page": "16", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ॐ सङ्कर्षणाय नमः ।", "ॐ वासुदेवाय नमः ।", "ॐ प्रद्युम्नाय नमः ।", "ॐ अनिरुद्धाय नमः ।", "ॐ पुरुषोत्तमाय नमः ।", "ॐ अधोक्षजाय नमः ।", "ॐ नरसिंहाय नमः ।", "ॐ अच्युताय नमः ।", "ॐ जनार्दनाय नमः ।", "ॐ उपेन्द्राय नमः ।", "ॐ हरये नमः ।", "ॐ श्रीकृष्णाय नमः ॥"], "iast": ["oṃ saṅkarṣaṇāya namaḥ ।", "oṃ vāsudevāya namaḥ ।", "oṃ pradyumnāya namaḥ ।", "oṃ aniruddhāya namaḥ ।", "oṃ puruṣottamāya namaḥ ।", "oṃ adhokṣajāya namaḥ ।", "oṃ narasiṃhāya namaḥ ।", "oṃ acyutāya namaḥ ।", "oṃ janārdanāya namaḥ ।", "oṃ upendrāya namaḥ ।", "oṃ haraye namaḥ ।", "oṃ śrīkṛṣṇāya namaḥ ॥"], "meaning": "Salutations to the twelve forms — Saṅkarṣaṇa, Vāsudeva, Pradyumna, Aniruddha, Puruṣottama, Adhokṣaja, Narasiṃha, Acyuta, Janārdana, Upendra, Hari and Śrīkṛṣṇa.", "action": "During the **kṛṣṇapakṣa** (dark fortnight), chant these names (in place of the śuklapakṣa set) while applying the ūrdhvapuṇḍra marks.", "audio": "audio/026-krsnapaksa-namaskara-mantras.wav", "cat": "morning"}, {"id": 27, "slug": "cakramudra-sudarshana", "title": "Cakramudrā — Sudarśana Mahājvāla", "chapter": "Pañcamudrādhāraṇam — Wearing the five mudrās", "book_page": "16", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["सुदर्शन महाज्वाल कोटिसूर्यसमप्रभ ।", "अज्ञानान्धस्य मे नित्यं विष्णोर्मार्गं प्रदर्शय ॥"], "iast": ["sudarśana mahājvāla koṭisūryasamaprabha ।", "ajñānāndhasya me nityaṃ viṣṇormārgaṃ pradarśaya ॥"], "meaning": "O Sudarśana of great flames, radiant as a crore suns — to me, blinded by ignorance, ever show the path to Viṣṇu.", "action": "Recited while wearing the **Cakramudrā** (the discus mark), the first of the five mudrās.", "audio": "audio/027-cakramudra-sudarshana.wav", "cat": "morning"}, {"id": 28, "slug": "shankhamudra-panchajanya", "title": "Śaṅkhamudrā — Pāñcajanya", "chapter": "Pañcamudrādhāraṇam — Wearing the five mudrās", "book_page": "17", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["पाञ्चजन्य निजध्वानध्वस्तपातकसञ्चय ।", "त्राहि मां पापिनं घोरसंसारार्णवपातिनम् ॥"], "iast": ["pāñcajanya nijadhvānadhvastapātakasañcaya ।", "trāhi māṃ pāpinaṃ ghorasaṃsārārṇavapātinam ॥"], "meaning": "O Pāñcajanya (conch), by whose own sound the accumulated heap of sins is destroyed — save me, a sinner fallen into the terrible ocean of saṃsāra.", "action": "Recited while wearing the **Śaṅkhamudrā** (conch mark) on the left side of the body.", "audio": "audio/028-shankhamudra-panchajanya.wav", "cat": "morning"}, {"id": 29, "slug": "gadamudra-gadadhara", "title": "Gadāmudrā — Gadādhara", "chapter": "Pañcamudrādhāraṇam — Wearing the five mudrās", "book_page": "17", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ब्रह्माण्डभुवनारम्भमूलस्तम्भो गदाधरः ।", "कौमोदकी करे यस्य तं नमामि गदाधरम् ॥"], "iast": ["brahmāṇḍabhuvanārambhamūlastambho gadādharaḥ ।", "kaumodakī kare yasya taṃ namāmi gadādharam ॥"], "meaning": "Gadādhara, the foundational pillar at the origin of the cosmic egg and its worlds, in whose hand is the mace Kaumodakī — to that Gadādhara I bow.", "action": "Recited while wearing the **Gadāmudrā** (mace mark).", "audio": "audio/029-gadamudra-gadadhara.wav", "cat": "morning"}, {"id": 30, "slug": "padmamudra-yogisha", "title": "Padmamudrā — Yogīśa", "chapter": "Pañcamudrādhāraṇam — Wearing the five mudrās", "book_page": "18", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["संसारभयभीतानां योगिनामभयप्रदः ।", "पद्महस्तेन यो देवो योगीशं तं नमाम्यहम् ॥"], "iast": ["saṃsārabhayabhītānāṃ yoginām abhayapradaḥ ।", "padmahastena yo devo yogīśaṃ taṃ namāmyaham ॥"], "meaning": "The Lord who gives fearlessness to the yogis frightened by the fear of saṃsāra, who bears the lotus in His hand — that Lord of yogis I bow to.", "action": "Recited while wearing the **Padmamudrā** (lotus mark) on the middle of the body. The five mudrās are: Cakra, Śaṅkha, Gadā, Padma and Nārāyaṇa.", "audio": "audio/030-padmamudra-yogisha.wav", "cat": "morning"}, {"id": 31, "slug": "narayanamudra", "title": "Nārāyaṇamudrā", "chapter": "Pañcamudrādhāraṇam — Wearing the five mudrās", "book_page": "20", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["नारायण नमस्तेऽस्तु नाममुद्राङ्कितं नरम् ।", "दृष्ट्वैव लभते मुक्तिं चण्डालो ब्रह्मघातकः ॥"], "iast": ["nārāyaṇa namaste'stu nāmamudrāṅkitaṃ naram ।", "dṛṣṭvaiva labhate muktiṃ caṇḍālo brahmaghātakaḥ ॥"], "meaning": "Salutations to you, O Nārāyaṇa. Merely on seeing a person marked with the nāma-mudrās, even a caṇḍāla or a slayer of a brāhmaṇa attains liberation.", "action": "Recited while wearing the **Nārāyaṇamudrā**, which should be applied wherever a nāma has been applied. This completes the five mudrās.", "audio": "audio/031-narayanamudra.wav", "cat": "morning"}, {"id": 32, "slug": "acamana-mantras", "title": "Ācamana Mantras", "chapter": "Sandhyāvandanam — Ācamanam", "book_page": "21", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं ऋग्वेदाय स्वाहा ।", "ओं यजुर्वेदाय स्वाहा ।", "ओं सामवेदाय स्वाहा ।", "ओं अथर्वणवेदाय नमः ।", "ओं इतिहासपुराणेभ्यो नमः ।", "ओं अग्नये नमः । ओं अग्नये नमः ।", "ओं वायवे नमः । ओं वायवे नमः ।", "ओं सूर्याय नमः । ओं चन्द्राय नमः ।", "ओं दिग्भ्यो नमः । ओं दिग्भ्यो नमः ।", "ओं इन्द्राय नमः । ओं इन्द्राय नमः ।", "ओं विष्णवे नमः । ओं विष्णवे नमः ।", "ओं पृथिव्यै नमः । ओं पृथिव्यै नमः ।", "ओं आत्मने नमः । ओं अन्तरात्मने नमः ।", "ओं परमात्मने नमः ।"], "iast": ["oṃ ṛgvedāya svāhā ।", "oṃ yajurvedāya svāhā ।", "oṃ sāmavedāya svāhā ।", "oṃ atharvaṇavedāya namaḥ ।", "oṃ itihāsapurāṇebhyo namaḥ ।", "oṃ agnaye namaḥ । oṃ agnaye namaḥ ।", "oṃ vāyave namaḥ । oṃ vāyave namaḥ ।", "oṃ sūryāya namaḥ । oṃ candrāya namaḥ ।", "oṃ digbhyo namaḥ । oṃ digbhyo namaḥ ।", "oṃ indrāya namaḥ । oṃ indrāya namaḥ ।", "oṃ viṣṇave namaḥ । oṃ viṣṇave namaḥ ।", "oṃ pṛthivyai namaḥ । oṃ pṛthivyai namaḥ ।", "oṃ ātmane namaḥ । oṃ antarātmane namaḥ ।", "oṃ paramātmane namaḥ ।"], "meaning": "Oṃ, oblation to the Ṛgveda; to the Yajurveda; to the Sāmaveda; salutations to the Atharvaveda; to the Itihāsas and Purāṇas; salutations to Agni, to Vāyu, to Sūrya, to Candra, to the directions, to Indra, to Viṣṇu, to Pṛthivī (Earth), to the Self (ātman), to the inner Self (antarātman), and to the Supreme Self (paramātman).", "action": "The Ācamana that opens Sandhyāvandanam: sip water and recite these mantras of salutation to the Vedas and presiding deities to purify oneself before the rite.", "audio": "audio/032-acamana-mantras.wav", "cat": "sandhya"}, {"id": 33, "slug": "pranayama-mantra", "title": "Prāṇāyāma Mantra (Vyāhṛti–Gāyatrī)", "chapter": "Sandhyāvandanam — Prāṇāyāmaḥ", "book_page": "24", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं भूः । ओं भुवः । ओं स्वः । ओं महः । ओं जनः । ओं तपः । ओं सत्यम् ।", "ओं तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि ।", "धियो यो नः प्रचोदयात् ।", "ओमापो ज्योतीरसोऽमृतं ब्रह्म भूर्भुवःस्वरोम् ।"], "iast": ["oṃ bhūḥ । oṃ bhuvaḥ । oṃ svaḥ । oṃ mahaḥ । oṃ janaḥ । oṃ tapaḥ । oṃ satyam ।", "oṃ tatsaviturvareṇyaṃ bhargo devasya dhīmahi ।", "dhiyo yo naḥ pracodayāt ।", "omāpo jyotīraso'mṛtaṃ brahma bhūrbhuvaḥsvarom ।"], "meaning": "Oṃ — earth, atmosphere, heaven, the great, the created, the austere, the true (the seven realms). We meditate upon that adorable splendour of the divine Savitṛ; may He inspire our intellects. Oṃ — the waters, the light, the essence (rasa), the immortal Brahman, the earth-atmosphere-heaven — Oṃ.", "action": "The Prāṇāyāma mantra, preceded by its viniyoga (*praṇavasya parabrahma ṛṣiḥ; daivī gāyatrī chandaḥ; paramātmā devatā; prāṇāyāme viniyogaḥ*). Hold the nose with the thumb and ring finger of the right hand; exhale through the right nostril, then perform controlled breathing (pūraka, kumbhaka, recaka) while mentally reciting this mantra.", "audio": null, "cat": "sandhya"}, {"id": 34, "slug": "marjana-apohistha", "title": "Mārjana — Āpo Hi Ṣṭhā", "chapter": "Sandhyāvandanam — Mārjanam", "book_page": "26", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं आपो हि ष्ठा मयोभुवस्ता न ऊर्जे दधातन ।", "महे रणाय चक्षसे ।", "यो वः शिवतमो रसस्तस्य भाजयतेह नः ।", "उशतीरिव मातरः ।", "तस्मा अरं गमाम वो यस्य क्षयाय जिन्वथ ।", "आपो जनयथा च नः । ओं ।"], "iast": ["oṃ āpo hi ṣṭhā mayobhuvastā na ūrje dadhātana ।", "mahe raṇāya cakṣase ।", "yo vaḥ śivatamo rasastasya bhājayateha naḥ ।", "uśatīriva mātaraḥ ।", "tasmā araṃ gamāma vo yasya kṣayāya jinvatha ।", "āpo janayathā ca naḥ । oṃ ।"], "meaning": "O Waters, you are indeed the source of well-being; grant us nourishment, that we may behold great delight. Make us partake here of that most auspicious essence of yours, like loving mothers. May we come fully to that abode of yours for which you quicken us. O Waters, generate us anew.", "action": "The Mārjana — spraying water (taken in the spoon) over oneself with this Āpohiṣṭhā sūkta. Viniyoga: *āpohiṣṭheti tryarcasya sūktasya āmbarīṣa-sindhudvīpa ṛṣiḥ; gāyatrī chandaḥ; āpo devatā; mārjane viniyogaḥ.*", "audio": null, "cat": "sandhya"}, {"id": 35, "slug": "jalabhimantrana-surya-pratah", "title": "Jalābhimantraṇa — Sūryaśca (morning)", "chapter": "Sandhyāvandanam — Jalābhimantraṇam", "book_page": "28", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं सूर्यश्च मा मन्युश्च मन्युपतयश्च मन्युकृतेभ्यः ।", "पापेभ्यो रक्षन्ताम् ।", "यद्रात्र्या पापमकार्षम् ।", "मनसा वाचा हस्ताभ्याम् ।", "पद्भ्यामुदरेण शिश्ना ।", "रात्रिस्तदवलुम्पतु ।", "यत्किञ्च दुरितं मयि ।", "इदमहं माममृतयोनौ ।", "सूर्ये ज्योतिषि जुहोमि स्वाहा । ओं ।"], "iast": ["oṃ sūryaśca mā manyuśca manyupatayaśca manyukṛtebhyaḥ ।", "pāpebhyo rakṣantām ।", "yadrātryā pāpamakārṣam ।", "manasā vācā hastābhyām ।", "padbhyāmudareṇa śiśnā ।", "rātristadavalumpatu ।", "yatkiñca duritaṃ mayi ।", "idamahaṃ māmamṛtayonau ।", "sūrye jyotiṣi juhomi svāhā । oṃ ।"], "meaning": "May Sūrya, and Manyu (wrath), and the lords of wrath, protect me from the sins arising from anger. Whatever sin I have committed during the night — by mind, speech, hands, feet, belly, or organs — may the night wipe it away. Whatever evil there is in me, I offer it into Sūrya, the light, the immortal source — svāhā.", "action": "The morning Jalābhimantraṇa: hold a little water in the right palm and, on uttering *svāhā*, drink it (*iti jalaṃ prāśya*). The sin committed in the night is expiated. Viniyoga: *sūryaśceti asya mantrasya nārāyaṇa ṛṣiḥ; prakṛtiḥ chandaḥ; sūryo devatā; jalābhimantraṇe viniyogaḥ.*", "audio": "audio/035-jalabhimantrana-surya-pratah.wav", "cat": "sandhya"}, {"id": 36, "slug": "jalabhimantrana-apah-punantu-madhyahna", "title": "Jalābhimantraṇa — Āpaḥ Punantu (midday)", "chapter": "Sandhyāvandanam — Jalābhimantraṇam", "book_page": "29", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं आपः पुनन्तु पृथिवीं पृथिवी पूता पुनातु माम् ।", "पुनन्तु ब्रह्मणस्पतिर्ब्रह्म पूता पुनातु माम् ।", "यदुच्छिष्टमभोज्यं यद्वा दुश्चरितं मम ।", "सर्वे पुनन्तु मामापोऽसतां च प्रतिग्रह स्वाहा । ओं ।"], "iast": ["oṃ āpaḥ punantu pṛthivīṃ pṛthivī pūtā punātu mām ।", "punantu brahmaṇaspatirbrahma pūtā punātu mām ।", "yaducchiṣṭamabhojyaṃ yadvā duścaritaṃ mama ।", "sarve punantu māmāpo'satāṃ ca pratigraha svāhā । oṃ ।"], "meaning": "May the Waters purify the earth; may the purified earth purify me. May Bṛhaspati (Brahmaṇaspati) purify me; may the purified Brahman purify me. Whatever remnant (ucchiṣṭa) is unfit to eat, or whatever misconduct of mine — may the Waters purify me of it all, and of the acceptance of gifts from the unworthy — svāhā.", "action": "The midday (madhyāhna) Jalābhimantraṇa: hold water in the right palm and drink it on *svāhā* (*iti jalaṃ prāśya*). Viniyoga: *āpaḥ punantvityasya mantrasya pūta ṛṣiḥ; aṣṭī chandaḥ; āpo devatā; apāṃ prāśane viniyogaḥ.*", "audio": "audio/036-jalabhimantrana-apah-punantu-madhyahna.wav", "cat": "sandhya"}, {"id": 37, "slug": "jalabhimantrana-agnisca-sayam", "title": "Jalābhimantraṇa — Agniśca (evening)", "chapter": "Sandhyāvandanam — Jalābhimantraṇam", "book_page": "30", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं अग्निश्च मा मन्युश्च मन्युपतयश्च मन्युकृतेभ्यः ।", "पापेभ्यो रक्षन्ताम् ।", "यदह्ना पापमकार्षम् ।", "मनसा वाचा हस्ताभ्याम् ।", "पद्भ्यामुदरेण शिश्ना ।", "अहस्तदवलुम्पतु ।", "यत्किञ्च दुरितं मयि ।", "इदमहं माममृतयोनौ ।", "सत्ये ज्योतिषि जुहोमि स्वाहा । ओं ।"], "iast": ["oṃ agniśca mā manyuśca manyupatayaśca manyukṛtebhyaḥ ।", "pāpebhyo rakṣantām ।", "yadahnā pāpamakārṣam ।", "manasā vācā hastābhyām ।", "padbhyāmudareṇa śiśnā ।", "ahastadavalumpatu ।", "yatkiñca duritaṃ mayi ।", "idamahaṃ māmamṛtayonau ।", "satye jyotiṣi juhomi svāhā । oṃ ।"], "meaning": "May Agni, and Manyu (wrath), and the lords of wrath, protect me from the sins arising from anger. Whatever sin I have committed during the day — by mind, speech, hands, feet, belly, or organs — may the day wipe it away. Whatever evil there is in me, I offer it into the true light, the immortal source — svāhā.", "action": "The evening Jalābhimantraṇa (counterpart of the morning *sūryaśca*): drink the water on *svāhā*. Then do ācamana twice (*dvirācamya*) and repeat the Mārjana with the *āpohiṣṭhā* mantra. Viniyoga: *…prakṛtiḥ chandaḥ; agnirdevatā; jalābhimantraṇe viniyogaḥ.*", "audio": "audio/037-jalabhimantrana-agnisca-sayam.wav", "cat": "sandhya"}, {"id": 38, "slug": "a-krsnena-rajasa", "title": "Ā Kṛṣṇena Rajasā (noon arghya)", "chapter": "Sandhyāvandanam — Arghyapradānam (madhyāhnika)", "book_page": "33", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं आ कृष्णेन रजसा वर्तमानो निवेशयन्नमृतं मर्त्यं च ।", "हिरण्ययेन सविता रथेना देवो याति भुवनानि पश्यन् । ओं ।"], "iast": ["oṃ ā kṛṣṇena rajasā vartamāno niveśayannamṛtaṃ martyaṃ ca ।", "hiraṇyayena savitā rathenā devo yāti bhuvanāni paśyan । oṃ ।"], "meaning": "Moving through the dark realm, bringing to rest both the immortal and the mortal, the divine Savitṛ comes on his golden chariot, beholding all the worlds.", "action": "The second arghya of the noon (mādhyāhnika) sandhyā: the three arghyas are offered with (1) *haṃsaḥ śuciṣad* (shloka 128), (2) this *ā kṛṣṇena rajasā* verse, and (3) the Gāyatrī. Viniyoga: *ākṛṣṇenarajasetyasya mantrasya hiraṇyastūpa ṛṣiḥ; triṣṭup chandaḥ; savitā devatā; mādhyāhnikasandhyāṅgasūryārghyapradāne viniyogaḥ.*", "audio": null, "cat": "sandhya"}, {"id": 39, "slug": "prayascittarghya-yadadya-kacca", "title": "Prāyaścittārghya — Yadadya Kacca (morning)", "chapter": "Sandhyāvandanam — Prāyaścittārghyam", "book_page": "34", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं यदद्य कच्च वृत्रहन्नुदगा अभि सूर्य ।", "सर्वं तदिन्द्र ते वशे । ओं ।"], "iast": ["oṃ yadadya kacca vṛtrahannudagā abhi sūrya ।", "sarvaṃ tadindra te vaśe । oṃ ।"], "meaning": "O slayer of Vṛtra (Indra/Sūrya), whatever the Sun has risen over today — all that, O Indra, is in your power.", "action": "The morning Prāyaścittārghya — an arghya offered in compensation for missing the proper time of arghya; offer one arghya with this mantra. Viniyoga: *yadadya kacceti mantrasya suvākṣa ṛṣiḥ; gāyatrī chandaḥ; sūryo devatā; prātaḥsandhyākālātīta-doṣaparihārārtham prāyaścittārghyapradāne viniyogaḥ.*", "audio": "audio/039-prayascittarghya-yadadya-kacca.wav", "cat": "sandhya"}, {"id": 40, "slug": "prayascittarghya-pratardevim-aditim", "title": "Prāyaścittārghya — Prātardevīmaditiṃ (noon)", "chapter": "Sandhyāvandanam — Prāyaścittārghyam", "book_page": "35", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं प्रातर्देवीमदितिं जोहवीमि मध्यं दिन उदिता सूर्यस्य ।", "राये मित्रावरुणा सर्वतातेळे तोकाय तनयाय शं योः । ओं ।"], "iast": ["oṃ prātardevīmaditiṃ johavīmi madhyaṃ dina uditā sūryasya ।", "rāye mitrāvaruṇā sarvatāteḻe tokāya tanayāya śaṃ yoḥ । oṃ ।"], "meaning": "I invoke the divine Aditi at dawn, at midday, and at the rising of the Sun. O Mitra and Varuṇa, I implore you in full measure for wealth, and for the well-being and peace of our children and progeny.", "action": "The noon (mādhyāhna) Prāyaścittārghya; offer one arghya with this mantra. Viniyoga: *prātardevīmityasya mantrasya ātreya urucakri ṛṣiḥ; triṣṭup chandaḥ; mitrāvaruṇau devate; mādhyāhnakālātīta-doṣaprāyaścittārghyapradāne viniyogaḥ.*", "audio": "audio/040-prayascittarghya-pratardevim-aditim.wav", "cat": "sandhya"}, {"id": 41, "slug": "prayascittarghya-udghedabhi-sayam", "title": "Prāyaścittārghya — Udghedabhi (evening)", "chapter": "Sandhyāvandanam — Prāyaścittārghyam", "book_page": "35", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं उद्घेदभि श्रुतामघं वृषभं नर्यापसम् ।", "अस्तारमेषि सूर्य । ओं ।"], "iast": ["oṃ udghedabhi śrutāmaghaṃ vṛṣabhaṃ naryāpasam ।", "astārameṣi sūrya । oṃ ।"], "meaning": "Rise up towards the famed, bounteous, manly, beneficent one (Sūrya); O Sūrya, you reach the setting place (the western home of day).", "action": "The evening (sāyaṅkāla) Prāyaścittārghya; offer one arghya with this mantra. Viniyoga: *udghedabhītyasya mantrasya sukakṣa ṛṣiḥ; gāyatrī chandaḥ; agnirdevatā; sāyaṃsandhyākālātīta-doṣaparihārārtham prāyaścittārghyapradāne viniyogaḥ.*\n\n> *Note from the text: when one has not learned to utter a Veda mantra with the proper intonation (svara), it may be uttered like an ordinary stotra mantra.*", "audio": "audio/041-prayascittarghya-udghedabhi-sayam.wav", "cat": "sandhya"}, {"id": 42, "slug": "gayatryakarshana-prati-caksva", "title": "Gāyatryākarṣaṇa — Prati Cakṣva Vi Cakṣva", "chapter": "Sandhyāvandanam — Gāyatryākarṣaṇam", "book_page": "36", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ओं प्रति चक्ष्व वि चक्ष्वेन्द्रश्च सोम जागृतम् ।", "रक्षोभ्यो वधमस्य तमशनिं यातुमद्भ्यः । ओं ।"], "iast": ["oṃ prati cakṣva vi cakṣvendraśca soma jāgṛtam ।", "rakṣobhyo vadhamasya tamaśaniṃ yātumadbhyaḥ । oṃ ।"], "meaning": "Look forth, look around! O Indra and Soma, be watchful. Hurl your weapon, the thunderbolt, against the rākṣasas and the sorcerers.", "action": "The Gāyatryākarṣaṇa — invoking and drawing in the Gāyatrī. Viniyoga: *prati cakṣva vi cakṣveti mantrasya vasiṣṭha ṛṣiḥ; anuṣṭup chandaḥ; rakṣohaṇāvindrāsomau devate; gāyatryākarṣaṇe viniyogaḥ.*", "audio": "audio/042-gayatryakarshana-prati-caksva.wav", "cat": "sandhya"}, {"id": 43, "slug": "ehi-tvam-devi-gayatri", "title": "Ehi Tvaṃ Devi Gāyatri (Gāyatrī invocation)", "chapter": "Sandhyāvandanam — Gāyatryākarṣaṇam", "book_page": "37", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["एहि त्वं देवि शीघ्रं वै गायत्रि ब्रह्मरूपिणि ।", "जपानुष्ठानसिद्ध्यर्थं प्रविश्य हृदयं मम ॥"], "iast": ["ehi tvaṃ devi śīghraṃ vai gāyatri brahmarūpiṇi ।", "japānuṣṭhānasiddhyarthaṃ praviśya hṛdayaṃ mama ॥"], "meaning": "Come quickly, O Goddess Gāyatrī, you whose form is Brahman; for the success of my japa and observance, enter into my heart.", "action": "Recited to draw the Gāyatrī into the heart (gāyatryākarṣaṇa), followed by \"*gāyatrī ca mahādevi praviśya hṛdayaṃ mama; asāvādityo brahma; omāpojyotiraso'mṛtaṃ brahma bhūrbhuvaḥsvarom*.\" Then circumambulate oneself with water and perform ācamana twice.", "audio": "audio/043-ehi-tvam-devi-gayatri.wav", "cat": "sandhya"}, {"id": 44, "slug": "devatarghya-tarpana-suklapaksa", "title": "Devatārghya — Dvādaśanāma Tarpaṇa (bright half)", "chapter": "Sandhyāvandanam — Devatārghyam", "book_page": "38", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं केशवं तर्पयामि । ओं नारायणं तर्पयामि । ओं माधवं तर्पयामि ।", "ओं गोविन्दं तर्पयामि । ओं विष्णुं तर्पयामि । ओं मधुसूदनं तर्पयामि ।", "ओं त्रिविक्रमं तर्पयामि । ओं वामनं तर्पयामि । ओं श्रीधरं तर्पयामि ।", "ओं हृषीकेशं तर्पयामि । ओं पद्मनाभं तर्पयामि । ओं दामोदरं तर्पयामि ।"], "iast": ["oṃ keśavaṃ tarpayāmi । oṃ nārāyaṇaṃ tarpayāmi । oṃ mādhavaṃ tarpayāmi ।", "oṃ govindaṃ tarpayāmi । oṃ viṣṇuṃ tarpayāmi । oṃ madhusūdanaṃ tarpayāmi ।", "oṃ trivikramaṃ tarpayāmi । oṃ vāmanaṃ tarpayāmi । oṃ śrīdharaṃ tarpayāmi ।", "oṃ hṛṣīkeśaṃ tarpayāmi । oṃ padmanābhaṃ tarpayāmi । oṃ dāmodaraṃ tarpayāmi ।"], "meaning": "I offer tarpaṇa (water-oblation) to Keśava, Nārāyaṇa, Mādhava, Govinda, Viṣṇu, Madhusūdana, Trivikrama, Vāmana, Śrīdhara, Hṛṣīkeśa, Padmanābha, and Dāmodara — the twelve names of the Lord.", "action": "The Devatārghya offered during the **śuklapakṣa** (bright half of the month), in this forward order of the twelve names. Then perform ācamana twice (*dvirācamya*).", "audio": "audio/044-devatarghya-tarpana-suklapaksa.wav", "cat": "sandhya"}, {"id": 45, "slug": "devatarghya-tarpana-krsnapaksa", "title": "Devatārghya — Tarpaṇa (dark half)", "chapter": "Sandhyāvandanam — Devatārghyam", "book_page": "39", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं सङ्कर्षणं तर्पयामि । ओं वासुदेवं तर्पयामि । ओं प्रद्युम्नं तर्पयामि ।", "ओं अनिरुद्धं तर्पयामि । ओं पुरुषोत्तमं तर्पयामि । ओं अधोक्षजं तर्पयामि ।", "ओं नारसिंहं तर्पयामि । ओं अच्युतं तर्पयामि । ओं जनार्दनं तर्पयामि ।", "ओं उपेन्द्रं तर्पयामि । ओं हरिं तर्पयामि । ओं श्रीकृष्णं तर्पयामि ।"], "iast": ["oṃ saṅkarṣaṇaṃ tarpayāmi । oṃ vāsudevaṃ tarpayāmi । oṃ pradyumnaṃ tarpayāmi ।", "oṃ aniruddhaṃ tarpayāmi । oṃ puruṣottamaṃ tarpayāmi । oṃ adhokṣajaṃ tarpayāmi ।", "oṃ nārasiṃhaṃ tarpayāmi । oṃ acyutaṃ tarpayāmi । oṃ janārdanaṃ tarpayāmi ।", "oṃ upendraṃ tarpayāmi । oṃ hariṃ tarpayāmi । oṃ śrīkṛṣṇaṃ tarpayāmi ।"], "meaning": "I offer tarpaṇa to Saṅkarṣaṇa, Vāsudeva, Pradyumna, Aniruddha, Puruṣottama, Adhokṣaja, Nārasiṃha, Acyuta, Janārdana, Upendra, Hari, and Śrīkṛṣṇa.", "action": "The Devatārghya offered during the **kṛṣṇapakṣa** (dark half of the month), with this second set of twelve names. Then perform ācamana twice (*dvirācamya*).", "audio": "audio/045-devatarghya-tarpana-krsnapaksa.wav", "cat": "sandhya"}, {"id": 46, "slug": "shuklambaradharam", "title": "Śuklāmbaradharaṃ Viṣṇum", "chapter": "Sandhyāvandanam — Hariguru-dhyānam", "book_page": "41", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम् ।", "प्रसन्नवदनं ध्यायेत्सर्वविघ्नोपशान्तये ॥"], "iast": ["śuklāmbaradharaṃ viṣṇuṃ śaśivarṇaṃ caturbhujam ।", "prasannavadanaṃ dhyāyetsarvavighnopaśāntaye ॥"], "meaning": "One should meditate on Viṣṇu — clad in white, moon-hued, four-armed, of serene countenance — for the quelling of all obstacles.", "action": "A dhyāna verse recited at the start of the Hariguru-dhyāna, to remove obstacles before the rite.", "audio": "audio/046-shuklambaradharam.wav", "cat": "sandhya"}, {"id": 47, "slug": "sarvavighna-prashamanam", "title": "Sarvavighna-praśamanaṃ", "chapter": "Sandhyāvandanam — Hariguru-dhyānam", "book_page": "41", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["सर्वविघ्नप्रशमनं सर्वसिद्धिकरं परम् ।", "सर्वजीवप्रणेतारं वन्दे विजयदं हरिम् ॥"], "iast": ["sarvavighnapraśamanaṃ sarvasiddhikaraṃ param ।", "sarvajīvapraṇetāraṃ vande vijayadaṃ harim ॥"], "meaning": "I salute Hari, the giver of victory — queller of all obstacles, granter of all attainments, supreme, and guide of all living beings.", "action": "A salutation verse of the Hariguru-dhyāna.", "audio": "audio/047-sarvavighna-prashamanam.wav", "cat": "sandhya"}, {"id": 48, "slug": "lakshminarayanam-vande", "title": "Lakṣmīnārāyaṇaṃ Vande", "chapter": "Sandhyāvandanam — Hariguru-dhyānam", "book_page": "41", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["लक्ष्मीनारायणं वन्दे तद्भक्तप्रवरो हि यः ।", "श्रीमदानन्दतीर्थाख्यो गुरुस्तं च नमाम्यहम् ॥"], "iast": ["lakṣmīnārāyaṇaṃ vande tadbhaktapravaro hi yaḥ ।", "śrīmadānandatīrthākhyo gurustaṃ ca namāmyaham ॥"], "meaning": "I bow to Lakṣmī-Nārāyaṇa; and he who is His foremost devotee — the preceptor named Śrīmad Ānandatīrtha (Madhvācārya) — to that guru also I offer salutation.", "action": "The guru-vandana verse of the Hariguru-dhyāna, saluting Lakṣmī-Nārāyaṇa and the guru Madhvācārya.", "audio": "audio/048-lakshminarayanam-vande.wav", "cat": "sandhya"}, {"id": 49, "slug": "vede-ramayane-caiva", "title": "Vede Rāmāyaṇe Caiva (Viṣṇuḥ Sarvatra Gīyate)", "chapter": "Sandhyāvandanam — Hariguru-dhyānam", "book_page": "41", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["वेदे रामायणे चैव पुराणे भारते तथा ।", "आदावन्ते च मध्ये च विष्णुः सर्वत्र गीयते ॥"], "iast": ["vede rāmāyaṇe caiva purāṇe bhārate tathā ।", "ādāvante ca madhye ca viṣṇuḥ sarvatra gīyate ॥"], "meaning": "In the Veda, in the Rāmāyaṇa, in the Purāṇas and the Mahābhārata — at the beginning, the middle, and the end — Viṣṇu alone is sung everywhere.", "action": "A dhyāna verse affirming that all scriptures everywhere praise Viṣṇu.", "audio": "audio/049-vede-ramayane-caiva.wav", "cat": "sandhya"}, {"id": 50, "slug": "ramapatim-purnagunam", "title": "Ramāpatiṃ Pūrṇaguṇaṃ (Guru-paramparā vandana)", "chapter": "Sandhyāvandanam — Hariguru-dhyānam", "book_page": "41", "meter": "upajāti", "tts_skip": false, "tts_note": "", "devanagari": ["रमापतिं पूर्णगुणं मुकुन्दं व्यासं च विज्ञानसहस्रभानुम् ।", "पूर्णप्रबोधं च सुतत्त्वदीपं क्रमाद्गुरूंश्च प्रणमामि मूर्ध्ना ॥"], "iast": ["ramāpatiṃ pūrṇaguṇaṃ mukundaṃ vyāsaṃ ca vijñānasahasrabhānum ।", "pūrṇaprabodhaṃ ca sutattvadīpaṃ kramādgurūṃśca praṇamāmi mūrdhnā ॥"], "meaning": "The Lord of Ramā (Lakṣmī), full of all qualities, Mukunda; Vyāsa, the thousand-rayed sun of wisdom; Pūrṇaprabodha and Sutattvadīpa (the gurus) — to these preceptors in succession I bow with my head.", "action": "The guru-paramparā vandana of the Hariguru-dhyāna, saluting the line of teachers in order. Followed by \"*sarvābhyastattvadevatābhyo namaḥ; sarvābhyo mātṛkādevatābhyo namaḥ*\" (salutations to all the tattva-devatās and mātṛkā-devatās).", "audio": "audio/050-ramapatim-purnagunam.wav", "cat": "sandhya"}, {"id": 51, "slug": "prthvi-tvaya-dhrta-asanasuddhi", "title": "Pṛthvi Tvayā Dhṛtā (Āsanaśuddhi)", "chapter": "Sandhyāvandanam — Āsanaśuddhiḥ", "book_page": "43", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["पृथ्वि त्वया धृता लोका देवि त्वं विष्णुना धृता ।", "त्वं च धारय मां देवि पवित्रं कुरु चासनम् ॥"], "iast": ["pṛthvi tvayā dhṛtā lokā devi tvaṃ viṣṇunā dhṛtā ।", "tvaṃ ca dhāraya māṃ devi pavitraṃ kuru cāsanam ॥"], "meaning": "O Earth (Pṛthvī Devī), the worlds are upheld by you, and you yourself are upheld by Viṣṇu. O Goddess, uphold me too, and make my seat pure.", "action": "The Āsanaśuddhi — purification of the seat before the rite; a prayer to Bhū Devī. Viniyoga: *pṛthvītyasya merupṛṣṭha ṛṣiḥ; anuṣṭup chandaḥ; kūrmo devatā; āsanaśuddhyarthe jape viniyogaḥ.*", "audio": "audio/051-prthvi-tvaya-dhrta-asanasuddhi.wav", "cat": "sandhya"}, {"id": 52, "slug": "bhutoccatana-apasarpantu", "title": "Apasarpantu Te Bhūtā (Bhūtoccāṭana)", "chapter": "Sandhyāvandanam — Bhūtoccāṭanam", "book_page": "43", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["अपसर्पन्तु ते भूता ये भूता भुवि संस्थिताः ।", "ये भूता विघ्नकर्तारः ते नश्यन्तु शिवाज्ञया ॥", "भूतप्रेतपिशाचा ये ये चान्ये भुवि भारकाः ।", "तेषामप्यविरोधेन जपकर्म समारभे ॥", "निरस्तः परावसुः । इदमहमर्वावसोः सदने सीदामि ।"], "iast": ["apasarpantu te bhūtā ye bhūtā bhuvi saṃsthitāḥ ।", "ye bhūtā vighnakartāraḥ te naśyantu śivājñayā ॥", "bhūtapretapiśācā ye ye cānye bhuvi bhārakāḥ ।", "teṣāmapyavirodhena japakarma samārabhe ॥", "nirastaḥ parāvasuḥ । idamahamarvāvasoḥ sadane sīdāmi ।"], "meaning": "Let those spirits depart that dwell upon the earth; and those spirits that cause obstacles, let them perish by the command of the auspicious Lord. Whatever bhūtas, pretas, piśācas and other burdensome beings are on earth — even without conflict with them, I begin the work of japa. The far-dwelling (Parāvasu) is driven off; I take my seat here in the abode of the near-dwelling (Arvāvasu).", "action": "The Bhūtoccāṭana — driving away obstructing spirits before beginning japa. Viniyoga: *apasarpantvityasya mantrasya vāmadeva ṛṣiḥ; anuṣṭup chandaḥ; satyo devatā; samastabhūtoccāṭane viniyogaḥ.* (A variant adds: *ye cātra nivasantyeva devatāḥ bhuvi santatam, teṣāmapyavirodhena japakarma samārabhe.*)", "audio": "audio/052-bhutoccatana-apasarpantu.wav", "cat": "sandhya"}, {"id": 53, "slug": "gurunamaskara", "title": "Gurunamaskāra", "chapter": "Sandhyāvandanam — Gurunamaskāraḥ", "book_page": "45", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["श्री गुरुभ्यो नमः । पूर्वगुरुभ्यो नमः । आदिगुरुभ्यो नमः ।", "मूलगुरुभ्यो नमः । मूलदेवताभ्यो नमः । वासुदेवाय नमः ।"], "iast": ["śrī gurubhyo namaḥ । pūrvagurubhyo namaḥ । ādigurubhyo namaḥ ।", "mūlagurubhyo namaḥ । mūladevatābhyo namaḥ । vāsudevāya namaḥ ।"], "meaning": "Salutations to the revered gurus; to the earlier gurus; to the first guru; to the root guru; to the root deities; and to Vāsudeva.", "action": "The Gurunamaskāra — salutation to all the preceptors, essential at the beginning of any karma.", "audio": "audio/053-gurunamaskara.wav", "cat": "sandhya"}, {"id": 54, "slug": "karasuddhi", "title": "Karaśuddhi (Hand purification)", "chapter": "Sandhyāvandanam — Karaśuddhiḥ", "book_page": "45", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं यं । ओं रं । ओं वं । (एवं चतुर्वारं) अस्त्राय फट् ।"], "iast": ["oṃ yaṃ । oṃ raṃ । oṃ vaṃ । (evaṃ caturvāraṃ) astrāya phaṭ ।"], "meaning": "Oṃ yaṃ, Oṃ raṃ, Oṃ vaṃ (the seed-syllables of air, fire and water, repeated four times); astrāya phaṭ (to the weapon).", "action": "The Karaśuddhi — purification of the hands. Recite the bīja-mantras (repeating four times), then \"astrāya phaṭ\" and clap the palms. Touching the wrist, mid-palm and fingertips of both hands, front and back, is the essential purificatory process.", "audio": "audio/054-karasuddhi.wav", "cat": "sandhya"}, {"id": 55, "slug": "papapurusha-dhyana", "title": "Pāpapuruṣa-dhyāna (Brahmahatyāśiraskaṃ)", "chapter": "Sandhyāvandanam — Pāpapuruṣadhyānam", "book_page": "45", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ब्रह्महत्याशिरस्कं च स्वर्णस्तेयभुजद्वयम् ।", "सुरापानहृदायुक्तं गुरुतल्पकटिद्वयम् ॥", "तत्संयोगपदद्वन्द्वमङ्गप्रत्यङ्गपातकम् ।", "उपपातकरोमाणं रक्तश्मश्रुविलोचनम् ॥", "खड्गचर्मधरं कृष्णं कुक्षौ पापं विचिन्तयेत् ॥"], "iast": ["brahmahatyāśiraskaṃ ca svarṇasteyabhujadvayam ।", "surāpānahṛdāyuktaṃ gurutalpakaṭidvayam ॥", "tatsaṃyogapadadvandvamaṅgapratyaṅgapātakam ।", "upapātakaromāṇaṃ raktaśmaśruvilocanam ॥", "khaḍgacarmadharaṃ kṛṣṇaṃ kukṣau pāpaṃ vicintayet ॥"], "meaning": "One should visualize sin personified, dwelling in the belly: with the killing of a brahmin for its head, the stealing of gold for its two arms, the drinking of liquor for its heart, violating the guru's bed for its two hips, their combination for its two feet, the major sins for its limbs and minor limbs, the lesser sins for its body-hair — red-bearded and red-eyed, dark, bearing sword and shield.", "action": "The Pāpapuruṣa-dhyāna — visualizing the personified sin in the left side of the belly so as to cast it out (drawing it then to the navel), as part of inner purification before the Gāyatrī japa.", "audio": "audio/055-papapurusha-dhyana.wav", "cat": "sandhya"}, {"id": 56, "slug": "gayatri-karanyasa", "title": "Gāyatrī Karanyāsa", "chapter": "Sandhyāvandanam — Gāyatrī Mahāmantraḥ", "book_page": "49", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं तत्सवितुः अङ्गुष्ठाभ्यां नमः ।", "ओं वरेण्यं तर्जनीभ्यां नमः ।", "ओं भर्गो देवस्य मध्यमाभ्यां नमः ।", "ओं धीमहि अनामिकाभ्यां नमः ।", "ओं धियो यो नः कनिष्ठिकाभ्यां नमः ।", "ओं प्रचोदयात् करतलकरपृष्ठाभ्यां नमः ।"], "iast": ["oṃ tatsavituḥ aṅguṣṭhābhyāṃ namaḥ ।", "oṃ vareṇyaṃ tarjanībhyāṃ namaḥ ।", "oṃ bhargo devasya madhyamābhyāṃ namaḥ ।", "oṃ dhīmahi anāmikābhyāṃ namaḥ ।", "oṃ dhiyo yo naḥ kaniṣṭhikābhyāṃ namaḥ ।", "oṃ pracodayāt karatalakarapṛṣṭhābhyāṃ namaḥ ।"], "meaning": "Assigning the phrases of the Gāyatrī to the fingers: \"tatsavituḥ\" to the thumbs, \"vareṇyaṃ\" to the index fingers, \"bhargo devasya\" to the middle fingers, \"dhīmahi\" to the ring fingers, \"dhiyo yo naḥ\" to the little fingers, and \"pracodayāt\" to the palms and backs of the hands — salutations.", "action": "The Karanyāsa preceding the Gāyatrī japa — touching each pair of fingers in turn while reciting, to consecrate the hands.", "audio": "audio/056-gayatri-karanyasa.wav", "cat": "sandhya"}, {"id": 57, "slug": "gayatri-anganyasa", "title": "Gāyatrī Ṣaḍaṅganyāsa", "chapter": "Sandhyāvandanam — Gāyatrī Mahāmantraḥ", "book_page": "49", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं तत्सवितुः हृदयाय नमः ।", "ओं वरेण्यं शिरसे स्वाहा ।", "ओं भर्गो देवस्य शिखायै वषट् ।", "ओं धीमहि कवचाय हुम् ।", "ओं धियो यो नः नेत्राभ्यां वौषट् ।", "ओं प्रचोदयात् अस्त्राय फट् ।", "ओं भूर्भुवः स्वरोम् । (इति दिग्बन्धः)"], "iast": ["oṃ tatsavituḥ hṛdayāya namaḥ ।", "oṃ vareṇyaṃ śirase svāhā ।", "oṃ bhargo devasya śikhāyai vaṣaṭ ।", "oṃ dhīmahi kavacāya hum ।", "oṃ dhiyo yo naḥ netrābhyāṃ vauṣaṭ ।", "oṃ pracodayāt astrāya phaṭ ।", "oṃ bhūrbhuvaḥ svarom । (iti digbandhaḥ)"], "meaning": "Assigning the phrases of the Gāyatrī to the six limbs: \"tatsavituḥ\" to the heart, \"vareṇyaṃ\" to the head, \"bhargo devasya\" to the tuft, \"dhīmahi\" to the armour, \"dhiyo yo naḥ\" to the eyes, \"pracodayāt\" to the weapon; and \"bhūrbhuvaḥ svarom\" for the binding of the directions (digbandha).", "action": "The Ṣaḍaṅganyāsa preceding the Gāyatrī japa — touching heart, head, tuft, body (armour), eyes, and clapping (weapon), concluding with the digbandha.", "audio": "audio/057-gayatri-anganyasa.wav", "cat": "sandhya"}, {"id": 58, "slug": "gayatri-dhyana-dhyeyah-sada", "title": "Gāyatrī Dhyāna — Dhyeyaḥ Sadā Savitṛmaṇḍala", "chapter": "Sandhyāvandanam — Gāyatrī Mahāmantraḥ", "book_page": "50", "meter": "vasantatilakā", "tts_skip": false, "tts_note": "", "devanagari": ["ध्येयः सदा सवितृमण्डलमध्यवर्ती", "नारायणः सरसिजासनसन्निविष्टः ।", "केयूरवान् मकरकुण्डलवान् किरीटी", "हारी हिरण्मयवपुर्धृतशङ्खचक्रः ॥"], "iast": ["dhyeyaḥ sadā savitṛmaṇḍalamadhyavartī", "nārāyaṇaḥ sarasijāsanasanniviṣṭaḥ ।", "keyūravān makarakuṇḍalavān kirīṭī", "hārī hiraṇmayavapurdhṛtaśaṅkhacakraḥ ॥"], "meaning": "Ever to be meditated upon is Nārāyaṇa, dwelling in the centre of the sun's orb, seated on a lotus — wearing armlets, makara earrings, a crown and a garland, His body golden, bearing the conch and the discus.", "action": "The dhyāna of the Gāyatrī, meditating on Nārāyaṇa within the solar orb before the japa. (Preceded by: *oṃ procadādityavarṇaśca sūryamaṇḍalamadhyagaḥ; cakraśaṅkhadharo'ṅkasthadordvayo dhyeya eva ca.*)", "audio": "audio/058-gayatri-dhyana-dhyeyah-sada.wav", "cat": "sandhya"}, {"id": 59, "slug": "gayatri-mahamantra", "title": "Gāyatrī Mahāmantra", "chapter": "Sandhyāvandanam — Gāyatrī Mahāmantraḥ", "book_page": "50", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं भूर्भुवःस्वः ।", "तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि ।", "धियो यो नः प्रचोदयात् ।"], "iast": ["oṃ bhūrbhuvaḥsvaḥ ।", "tatsaviturvareṇyaṃ bhargo devasya dhīmahi ।", "dhiyo yo naḥ pracodayāt ।"], "meaning": "Oṃ. Earth, atmosphere, heaven. We meditate upon that adorable splendour of the divine Savitṛ; may He inspire our intellects.", "action": "The Gāyatrī Mahāmantra — the heart of Sandhyāvandanam, japa'd after the nyāsa and dhyāna. Repeat 1000, 100, or at least 10 times (*sahasraṃ – 1000, śataṃ – 100, daśa – 10 vā japet*). Viniyoga: *viśvāmitra ṛṣiḥ; gāyatrī chandaḥ (mukham); savitā devatā (hṛdayam).*", "audio": null, "cat": "sandhya"}, {"id": 60, "slug": "gayatri-procyate", "title": "Gāyatrī Procyate (why it is called Gāyatrī)", "chapter": "Sandhyāvandanam — Gāyatrī Mahāmantraḥ", "book_page": "55", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["प्रतिग्रहादन्नदोषात्पातकादुपपातकात् ।", "गायत्री प्रोच्यते तस्मात् गायन्तं त्रायते यतः ॥"], "iast": ["pratigrahādannadoṣātpātakādupapātakāt ।", "gāyatrī procyate tasmāt gāyantaṃ trāyate yataḥ ॥"], "meaning": "Because it protects the one who sings it (*gāyantaṃ trāyate*) from the faults of accepting gifts and of food, and from major and minor sins — therefore it is called \"Gāyatrī.\"", "action": "A verse explaining the power and the very name of the Gāyatrī; it is this mantra that is given on the upanayana day as the brahmopadeśa.", "audio": "audio/060-gayatri-procyate.wav", "cat": "sandhya"}, {"id": 61, "slug": "digupasthana-mitrasya-pratah", "title": "Digupasthāna — Mitrasya Carṣaṇīdhṛtaḥ (morning)", "chapter": "Sandhyāvandanam — Digupasthānam", "book_page": "55", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं मित्रस्य चर्षणीधृतोऽवो देवस्य सानसि ।", "द्युम्नं चित्रश्रवस्तमम् ॥", "मित्रो जनान्यातयति ब्रुवाणो मित्रो दाधार पृथिवीमुत द्याम् ।", "मित्रः कृष्टीरनिमिषाभि चष्टे मित्राय हव्यं घृतवज्जुहोत ॥", "प्र स मित्र मर्तो अस्तु प्रयस्वान्यस्त आदित्य शिक्षति व्रतेन ।", "न हन्यते न जीयते त्वोतो नैनमंहो अश्नोत्यन्तितो न दूरात् ॥"], "iast": ["oṃ mitrasya carṣaṇīdhṛto'vo devasya sānasi ।", "dyumnaṃ citraśravastamam ॥", "mitro janān yātayati bruvāṇo mitro dādhāra pṛthivīmuta dyām ।", "mitraḥ kṛṣṭīranimiṣābhi caṣṭe mitrāya havyaṃ ghṛtavajjuhota ॥", "pra sa mitra marto astu prayasvānyasta āditya śikṣati vratena ।", "na hanyate na jīyate tvoto nainamaṃho aśnotyantito na dūrāt ॥"], "meaning": "The favour of the divine Mitra, sustainer of men, is winning, most glorious, of wondrous fame. Mitra, when invoked, brings people together; Mitra upholds the earth and the heaven. Mitra beholds the peoples with unwinking eye — offer to Mitra the ghee-laden oblation.", "action": "The morning Digupasthāna (worship of the directions / the rising Sun as Mitra), standing facing east. Viniyoga: *gādhino viśvāmitra ṛṣiḥ; gāyatrī-triṣṭubhau chandasī; mitro devatā.*", "audio": null, "cat": "sandhya"}, {"id": 62, "slug": "digupasthana-imam-me-varuna-sayam", "title": "Digupasthāna — Imaṃ Me Varuṇa (evening)", "chapter": "Sandhyāvandanam — Digupasthānam", "book_page": "56", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं इमं मे वरुण श्रुधी हवमद्या च मृळय ।", "त्वामवस्युरा चके ॥", "तत्त्वा यामि ब्रह्मणा वन्दमानस्तदा शास्ते यजमानो हविर्भिः ।", "अहेळमानो वरुणेह बोध्युरुशंस मा न आयुः प्रमोषीः । ओं ।"], "iast": ["oṃ imaṃ me varuṇa śrudhī havamadyā ca mṛḻaya ।", "tvāmavasyurā cake ॥", "tattvā yāmi brahmaṇā vandamānastadā śāste yajamāno havirbhiḥ ।", "aheḻamāno varuṇeha bodhyuruśaṃsa mā na āyuḥ pramoṣīḥ । oṃ ।"], "meaning": "Hear, O Varuṇa, this call of mine today, and be gracious; longing for your aid I yearn for you. I approach you with sacred prayer, revering you; the worshipper entreats you with oblations. Unangered, O widely-praised Varuṇa, be mindful of us here; do not cut short our span of life.", "action": "The evening Digupasthāna (worship of the directions / the setting Sun as Varuṇa), standing facing west. It is a prayer to the presiding deities of all the directions. Viniyoga: *ājīgartiḥ śunaḥśepa ṛṣiḥ; tatastriṣṭup ādyā gāyatrī chandasī; varuṇo devatā.*", "audio": null, "cat": "sandhya"}, {"id": 63, "slug": "suryopasthana-udvayam-tamasaspari", "title": "Sūryopasthāna — Ud Vayaṃ Tamasaspari", "chapter": "Sandhyāvandanam — Sūryopasthānam", "book_page": "58", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं उद्वयं तमसस्परि ज्योतिष्पश्यन्त उत्तरम् ।", "देवं देवत्रा सूर्यमगन्म ज्योतिरुत्तमम् । ओं ।"], "iast": ["oṃ udvayaṃ tamasaspari jyotiṣpaśyanta uttaram ।", "devaṃ devatrā sūryamaganma jyotiruttamam । oṃ ।"], "meaning": "Beholding the higher light beyond the darkness, we have reached the divine Sūrya among the gods — the highest light.", "action": "The Sūryopasthāna (worship of the Sun), recited at noon (and as part of the sandhyā). Stand facing east, join the palms, and pray.", "audio": null, "cat": "sandhya"}, {"id": 64, "slug": "suryopasthana-udu-tyam-jatavedasam", "title": "Sūryopasthāna — Udu Tyaṃ Jātavedasaṃ", "chapter": "Sandhyāvandanam — Sūryopasthānam", "book_page": "58", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं उदु त्यं जातवेदसं देवं वहन्ति केतवः ।", "दृशे विश्वाय सूर्यम् । ओं ।"], "iast": ["oṃ udu tyaṃ jātavedasaṃ devaṃ vahanti ketavaḥ ।", "dṛśe viśvāya sūryam । oṃ ।"], "meaning": "The rays bear aloft that divine Sūrya, the knower of all beings (Jātavedas), so that all may behold him.", "action": "A Sūryopasthāna mantra. Touch the right shoulder with the right hand and the left shoulder with the left hand while reciting.", "audio": null, "cat": "sandhya"}, {"id": 65, "slug": "suryopasthana-citram-devanam", "title": "Sūryopasthāna — Citraṃ Devānām (Sūrya Ātmā)", "chapter": "Sandhyāvandanam — Sūryopasthānam", "book_page": "58", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं चित्रं देवानामुदगादनीकं चक्षुर्मित्रस्य वरुणस्याग्नेः ।", "आप्रा द्यावापृथिवी अन्तरिक्षं सूर्य आत्मा जगतस्तस्थुषश्च । ओं ।"], "iast": ["oṃ citraṃ devānāmudagādanīkaṃ cakṣurmitrasya varuṇasyāgneḥ ।", "āprā dyāvāpṛthivī antarikṣaṃ sūrya ātmā jagatastasthuṣaśca । oṃ ।"], "meaning": "The wondrous host of the gods has risen — the eye of Mitra, Varuṇa and Agni. He has filled heaven, earth and the mid-region: Sūrya is the soul of all that moves and all that is still.", "action": "A Sūryopasthāna mantra. Touch the chest with the right palm while reciting.", "audio": null, "cat": "sandhya"}, {"id": 66, "slug": "suryadarshana-taccaksur-devahitam", "title": "Sūryadarśana — Tac Cakṣur Devahitaṃ", "chapter": "Sandhyāvandanam — Sūryadarśanam", "book_page": "59", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं तच्चक्षुर्देवहितं शुक्रमुच्चरत् ।", "पश्येम शरदः शतम् । जीवेम शरदः शतम् ।", "नन्दाम शरदः शतम् । मोदाम शरदः शतम् ।", "भवाम शरदः शतम् । शृणवाम शरदः शतम् ।", "प्रब्रवाम शरदः शतम् । अजिताः स्याम शरदः शतम् ।", "ज्योक् पश्येम सूर्यं दृशे । ओं ।"], "iast": ["oṃ taccakṣurdevahitaṃ śukramuccarat ।", "paśyema śaradaḥ śatam । jīvema śaradaḥ śatam ।", "nandāma śaradaḥ śatam । modāma śaradaḥ śatam ।", "bhavāma śaradaḥ śatam । śṛṇavāma śaradaḥ śatam ।", "prabravāma śaradaḥ śatam । ajitāḥ syāma śaradaḥ śatam ।", "jyok paśyema sūryaṃ dṛśe । oṃ ।"], "meaning": "That pure, beneficent eye (the Sun), divinely set, rises. May we see it a hundred autumns; may we live a hundred autumns; may we rejoice, be glad, prosper, hear, and speak a hundred autumns; may we remain unconquered a hundred autumns — long may we behold the Sun.", "action": "The Sūryadarśana — uttering this mantra, look up at the sun. Do not glare at the sun for long; just glance up and turn the eye away.", "audio": null, "cat": "sandhya"}, {"id": 67, "slug": "ya-udagan-mahato-arnavat", "title": "Ya Udagān Mahato'rṇavāt", "chapter": "Sandhyāvandanam — Sūryadarśanam", "book_page": "59", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["य उदगान्महतोऽर्णवाद्विभ्राजमानः सलिलस्य मध्यात् ।", "अनानुदो वृषभो रोहिताक्षः सूर्यो विपश्चिन्मनसा पुनातु ॥"], "iast": ["ya udagānmahato'rṇavādvibhrājamānaḥ salilasya madhyāt ।", "anānudo vṛṣabho rohitākṣaḥ sūryo vipaścinmanasā punātu ॥"], "meaning": "He who rose shining from the great ocean, from the midst of the waters — the unyielding bull, the red-eyed one — may the wise Sūrya purify us with His mind.", "action": "A purificatory Sūrya mantra recited as part of the Sūryadarśana / Sūryopasthāna.", "audio": null, "cat": "sandhya"}, {"id": 68, "slug": "dinnamaskara", "title": "Diṅnamaskāra (Salutations to the directions)", "chapter": "Sandhyāvandanam — Diṅnamaskāraḥ", "book_page": "60", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं इन्द्राय नमः । ओं अग्नये नमः । ओं यमाय नमः । ओं निर्ऋतये नमः ।", "ओं वरुणाय नमः । ओं वायवे नमः । ओं सोमाय नमः । ओं ईशानाय नमः ।", "ओं सन्ध्यायै नमः । ओं सन्ध्यापतये नमः । ओं गायत्र्यै नमः ।", "ओं सावित्र्यै नमः । ओं सरस्वत्यै नमः । ओं ब्रह्मणे नमः ।", "ओं अनन्ताय नमः । ओं नमो ध्रुवासि ।"], "iast": ["oṃ indrāya namaḥ । oṃ agnaye namaḥ । oṃ yamāya namaḥ । oṃ nirṛtaye namaḥ ।", "oṃ varuṇāya namaḥ । oṃ vāyave namaḥ । oṃ somāya namaḥ । oṃ īśānāya namaḥ ।", "oṃ sandhyāyai namaḥ । oṃ sandhyāpataye namaḥ । oṃ gāyatryai namaḥ ।", "oṃ sāvitryai namaḥ । oṃ sarasvatyai namaḥ । oṃ brahmaṇe namaḥ ।", "oṃ anantāya namaḥ । oṃ namo dhruvāsi ।"], "meaning": "Salutations to Indra (east), Agni (south-east), Yama (south), Nirṛti (south-west), Varuṇa (west), Vāyu (north-west), Soma (north), Īśāna (north-east); to Sandhyā, the Lord of Sandhyā, Gāyatrī, Sāvitrī, Sarasvatī, and Brahmā; to Ananta (looking up); and \"salutation, you are Dhruva, the firm one\" (looking down).", "action": "The Diṅnamaskāra — saluting the presiding deities of the directions, turning from east clockwise through south-east, south, and so on; then looking up (to Ananta) and down (to Dhruva).", "audio": "audio/068-dinnamaskara.wav", "cat": "sandhya"}, {"id": 69, "slug": "indra-sresthani-dravinani-east", "title": "Indra Śreṣṭhāni Draviṇāni (East)", "chapter": "Sandhyāvandanam — Dik-upasthānam", "book_page": "62", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं इन्द्र श्रेष्ठानि द्रविणानि धेहि चित्तिं दक्षस्य सुभगत्वमस्मे ।", "पोषं रयीणामरिष्टिं तनूनां स्वाद्मानं वाचः सुदिनत्वमह्नाम् ॥"], "iast": ["oṃ indra śreṣṭhāni draviṇāni dhehi cittiṃ dakṣasya subhagatvamasme ।", "poṣaṃ rayīṇāmariṣṭiṃ tanūnāṃ svādmānaṃ vācaḥ sudinatvamahnām ॥"], "meaning": "O Indra, grant us the best of treasures, an able mind, and good fortune; growth of wealth, health of body, sweetness of speech, and fair days.", "action": "The first of the four direction-facing prayers — recited facing east (in the morning starting from the east, in the evening from the west), with folded hands. Viniyoga: *indra śreṣṭhānīti gṛtsamadaḥ; indras triṣṭup.*", "audio": null, "cat": "sandhya"}, {"id": 70, "slug": "yamaya-dharmarajaya-south", "title": "Yamāya Dharmarājāya (South — 14 names of Yama)", "chapter": "Sandhyāvandanam — Dik-upasthānam", "book_page": "62", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ओं यमाय धर्मराजाय मृत्यवे चान्तकाय च ।", "वैवस्वताय कालाय सर्वभूतक्षयाय च ॥", "औदुम्बराय दध्नाय नीलाय परमेष्ठिने ।", "वृकोदराय चित्राय चित्रगुप्ताय वै नमः ॥"], "iast": ["oṃ yamāya dharmarājāya mṛtyave cāntakāya ca ।", "vaivasvatāya kālāya sarvabhūtakṣayāya ca ॥", "audumbarāya dadhnāya nīlāya parameṣṭhine ।", "vṛkodarāya citrāya citraguptāya vai namaḥ ॥"], "meaning": "Salutations to Yama, to Dharmarāja, to Mṛtyu (Death), to Antaka, to Vaivasvata, to Kāla (Time), to the destroyer of all beings, to Audumbara, to Dadhna, to Nīla, to Parameṣṭhin, to Vṛkodara, to Citra, and to Citragupta — the fourteen names of Yama.", "action": "The second of the four direction-facing prayers — recited facing south.", "audio": "audio/070-yamaya-dharmarajaya-south.wav", "cat": "sandhya"}, {"id": 71, "slug": "dhruvasu-tvasu-west", "title": "Dhruvāsu Tvāsu (West — Varuṇa)", "chapter": "Sandhyāvandanam — Dik-upasthānam", "book_page": "62", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं ध्रुवासुत्वासु क्षितिषु क्षियन्तो व्यश्मत् पाशं वरुणो मुमोचत् ।", "अवो वन्वाना अदितेरुपस्थाद्यूयं पात स्वस्तिभिः सदा नः । ओं ।"], "iast": ["oṃ dhruvāsutvāsu kṣitiṣu kṣiyanto vyaśmat pāśaṃ varuṇo mumocat ।", "avo vanvānā aditerupasthādyūyaṃ pāta svastibhiḥ sadā naḥ । oṃ ।"], "meaning": "Dwelling on these firm abodes, may Varuṇa loosen the noose from us. Winning favour from the lap of Aditi — may you all ever protect us with your blessings.", "action": "The third of the four direction-facing prayers — recited facing west. Viniyoga: *dhruvāsutveti vasiṣṭho varuṇas triṣṭup.*", "audio": null, "cat": "sandhya"}, {"id": 72, "slug": "rtam-satyam-param-brahma-north", "title": "Ṛtaṃ Satyaṃ Paraṃ Brahma (North)", "chapter": "Sandhyāvandanam — Dik-upasthānam", "book_page": "63", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ओं ऋतं सत्यं परं ब्रह्म पुरुषं कृष्णपिङ्गलम् ।", "ऊर्ध्वरेतं विरूपाक्षं विश्वरूपाय वै नमो नमः । ओं ।"], "iast": ["oṃ ṛtaṃ satyaṃ paraṃ brahma puruṣaṃ kṛṣṇapiṅgalam ।", "ūrdhvaretaṃ virūpākṣaṃ viśvarūpāya vai namo namaḥ । oṃ ।"], "meaning": "To the cosmic order, the truth, the supreme Brahman, the Puruṣa dark-and-tawny, the one of uplifted vigour, the odd-eyed one — to the one of universal form, salutations again and again.", "action": "The fourth of the four direction-facing prayers — recited facing north.", "audio": "audio/072-rtam-satyam-param-brahma-north.wav", "cat": "sandhya"}, {"id": 73, "slug": "pradakshina-bhuridam", "title": "Bhūridaṃ Pradakṣiṇam (Pradakṣiṇa)", "chapter": "Sandhyāvandanam — Pradakṣiṇa", "book_page": "63", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं भूरिदं प्रदक्षिणम् । ओं भुवरिदं प्रदक्षिणम् ।", "ओं स्वरिदं प्रदक्षिणम् । ओं भूर्भुवः स्वरिदं प्रदक्षिणम् ॥"], "iast": ["oṃ bhūridaṃ pradakṣiṇam । oṃ bhuvaridaṃ pradakṣiṇam ।", "oṃ svaridaṃ pradakṣiṇam । oṃ bhūrbhuvaḥ svaridaṃ pradakṣiṇam ॥"], "meaning": "This circumambulation is for the earth-realm; this for the mid-realm; this for the heaven-realm; this for all the three realms together.", "action": "Recited while performing the four rounds of pradakṣiṇa (self-circumambulation).", "audio": "audio/073-pradakshina-bhuridam.wav", "cat": "sandhya"}, {"id": 74, "slug": "akashat-patitam-toyam", "title": "Ākāśāt Patitaṃ Toyaṃ", "chapter": "Sandhyāvandanam — Sarvadevanamaskāra", "book_page": "63", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["आकाशात् पतितं तोयं यथा गच्छति सागरम् ।", "सर्वदेवनमस्कारः केशवं प्रति गच्छति ॥"], "iast": ["ākāśāt patitaṃ toyaṃ yathā gacchati sāgaram ।", "sarvadevanamaskāraḥ keśavaṃ prati gacchati ॥"], "meaning": "Just as water fallen from the sky finds its way to the ocean, so does salutation offered to any of the gods reach Keśava (Viṣṇu).", "action": "Recited as the universal salutation (sarvadevanamaskāra) — affirming that all worship ultimately reaches the Supreme Lord. (In the morning facing east, in the evening facing west.)", "audio": "audio/074-akashat-patitam-toyam.wav", "cat": "sandhya"}, {"id": 75, "slug": "narayana-ashtakshara-mahamantra", "title": "Nārāyaṇa Aṣṭākṣara Mahāmantra", "chapter": "Daily japa — Nārāyaṇāṣṭākṣara", "book_page": "68", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं नमो नारायणाय ।"], "iast": ["oṃ namo nārāyaṇāya ।"], "meaning": "Oṃ. Salutations to Nārāyaṇa.", "action": "The eight-syllable (aṣṭākṣara) Mahāmantra of Śrī Nārāyaṇa, japa'd after the pañcāṅganyāsa. Viniyoga: *asya śrīnārāyaṇāṣṭākṣara-mahāmantrasya antaryāmī ṛṣiḥ; daivī gāyatrī chandaḥ; śrīnārāyaṇo devatā.* (The pañcāṅganyāsa assigns the bīja forms — \"*oṃ kṛddholkāya hṛdayāya namaḥ; oṃ maholkāya śirase svāhā…*\" — to the limbs before the japa.)", "audio": "audio/075-narayana-ashtakshara-mahamantra.wav", "cat": "japa"}, {"id": 76, "slug": "narayana-dhyana-udyadbhasvat", "title": "Nārāyaṇa Dhyāna — Udyadbhāsvatsamābhāsaḥ", "chapter": "Daily japa — Nārāyaṇāṣṭākṣara", "book_page": "68", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ओं उद्यद्भास्वत्समाभासश्चिदानन्दैकदेहवान् ।", "चक्रशङ्खगदापद्मधरो ध्येयोऽहमीश्वरः ॥", "लक्ष्मीधराभ्यामाश्लिष्टः स्वमूर्तिगणमध्यगः ।", "ब्रह्मवायुशिवाहीशविपैः शक्रादिकैरपि ॥", "सेव्यमानोऽधिकं भक्त्या नित्यनिःशेषशक्तिमान् ।", "मूर्तयोऽष्टावपि ध्येयाश्चक्रशङ्खवराभयैः ॥", "युक्ताः प्रदीपवर्णाश्च सर्वाभरणभूषिताः ।", "बिम्बोऽसि प्रतिबिम्बोऽस्मि तव यद्यपि चान्तरम् ॥", "स्वामिन् निर्दोष मद्दोषं विरेचय नमोऽस्तु ते ॥"], "iast": ["oṃ udyadbhāsvatsamābhāsaścidānandaikadehavān ।", "cakraśaṅkhagadāpadmadharo dhyeyo'hamīśvaraḥ ॥", "lakṣmīdharābhyāmāśliṣṭaḥ svamūrtigaṇamadhyagaḥ ।", "brahmavāyuśivāhīśavipaiḥ śakrādikairapi ॥", "sevyamāno'dhikaṃ bhaktyā nityaniḥśeṣaśaktimān ।", "mūrtayo'ṣṭāvapi dhyeyāścakraśaṅkhavarābhayaiḥ ॥", "yuktāḥ pradīpavarṇāśca sarvābharaṇabhūṣitāḥ ।", "bimbo'si pratibimbo'smi tava yadyapi cāntaram ॥", "svāmin nirdoṣa maddoṣaṃ virecaya namo'stu te ॥"], "meaning": "\"I, the Lord, whose radiance resembles the rising sun, whose single body is consciousness-and-bliss, bearing discus, conch, mace and lotus, am to be meditated upon.\" Embraced by Lakṣmī and Bhū (Dharā), abiding amid the host of His own forms, served with abounding devotion by Brahmā, Vāyu, Śiva, Ahīśa (Śeṣa, lord of serpents) and others including Śakra (Indra) — ever full of unlimited power. His eight forms too are to be meditated upon, each bearing discus, conch, boon-gesture and abhaya, lamp-bright and adorned with every ornament. You are the original (bimba), I am the reflection (pratibimba); though I am ever distinct from You and Your servant. O Lord, flawless one, wash away my faults — salutations to You.", "action": "The dhyāna recited before the Nārāyaṇa aṣṭākṣara japa, meditating on the Lord and His eight forms (the bimba–pratibimba contemplation).", "audio": "audio/076-narayana-dhyana-udyadbhasvat.wav", "cat": "japa"}, {"id": 77, "slug": "krishna-dhyana-dhyayeddharin", "title": "Kṛṣṇa Dhyāna — Dhyāyeddharinmaṇinibhaṃ", "chapter": "Daily japa — Kṛṣṇa mantra", "book_page": "72", "meter": "vasantatilakā", "tts_skip": false, "tts_note": "", "devanagari": ["ध्यायेद्धरिन्मणिनिभं जगदेकवन्द्यं", "सौन्दर्यसारमरिशङ्खवराभयानि ।", "दोर्भिर्दधानमजितं सरसं च भैष्मी-", "सत्यासमेतमखिलप्रदमिन्दिरेशम् ॥"], "iast": ["dhyāyeddharinmaṇinibhaṃ jagadekavandyaṃ", "saundaryasāramariśaṅkhavarābhayāni ।", "dorbhirdadhānamajitaṃ sarasaṃ ca bhaiṣmī-", "satyāsametamakhilapradamindireśam ॥"], "meaning": "One should meditate on the unconquered Kṛṣṇa, hued like a blue sapphire, the sole adored of the world, the very essence of beauty, bearing in His arms the discus, conch, boon-gesture and abhaya; the charming one, together with Bhaiṣmī (Rukmiṇī) and Satyā (Satyabhāmā), the giver of all, the Lord of Indirā (Lakṣmī).", "action": "The dhyāna recited before the Kṛṣṇa mantra japa.", "audio": "audio/077-krishna-dhyana-dhyayeddharin.wav", "cat": "japa"}, {"id": 78, "slug": "krishna-mantra-klim-krishnaya", "title": "Kṛṣṇa Mantra — Oṃ Klīṃ Kṛṣṇāya Namaḥ", "chapter": "Daily japa — Kṛṣṇa mantra", "book_page": "73", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं क्लीं कृष्णाय नमः ओं ।"], "iast": ["oṃ klīṃ kṛṣṇāya namaḥ oṃ ।"], "meaning": "Oṃ, klīṃ — salutations to Kṛṣṇa — Oṃ.", "action": "The Kṛṣṇa mantra, japa'd after its dhyāna; offer tarpaṇa \"*oṃ klīṃ kṛṣṇāya namaḥ oṃ tarpayāmi*\" once after every ten repetitions.", "audio": "audio/078-krishna-mantra-klim-krishnaya.wav", "cat": "japa"}, {"id": 79, "slug": "catvari-shrnga", "title": "Catvāri Śṛṅgā (Agni / Yajña)", "chapter": "Daily japa — Agni dhyāna", "book_page": "80", "meter": "gadya", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं चत्वारि शृङ्गा त्रयो अस्य पादा द्वे शीर्षे सप्त हस्तासो अस्य ।", "त्रिधा बद्धो वृषभो रोरवीति महो देवो मर्त्यां आ विवेश ॥ ओं ।"], "iast": ["oṃ catvāri śṛṅgā trayo asya pādā dve śīrṣe sapta hastāso asya ।", "tridhā baddho vṛṣabho roravīti maho devo martyāṃ ā viveśa ॥ oṃ ।"], "meaning": "Four are his horns, three his feet, two his heads, and seven his hands; thrice bound, the bull (Agni/Yajña) roars aloud — the great god has entered into mortals.", "action": "A Vedic mantra used in the Agni / Yajña-puruṣa dhyāna. Viniyoga: *catvāri śṛṅgety asya mantrasya gautamo vāmadeva ṛṣiḥ; triṣṭup chandaḥ; agnirdevatā; agnimūrtidhyāne viniyogaḥ.*", "audio": null, "cat": "japa"}, {"id": 80, "slug": "agnim-prajvalitam-vande", "title": "Agniṃ Prajvalitaṃ Vande", "chapter": "Daily japa — Agni dhyāna", "book_page": "80", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ओं अग्निं प्रज्वलितं वन्दे जातवेदं हुताशनम् ।", "सुवर्णवर्णमनलं समिद्धं विश्वतोमुखम् ॥", "श्री यज्ञपुरुषाय नमः ।"], "iast": ["oṃ agniṃ prajvalitaṃ vande jātavedaṃ hutāśanam ।", "suvarṇavarṇamanalaṃ samiddhaṃ viśvatomukham ॥", "śrī yajñapuruṣāya namaḥ ।"], "meaning": "I salute the blazing Agni, the knower of all (Jātavedas), the consumer of oblations, gold-hued, well-kindled, facing in all directions. Salutations to the Yajña-puruṣa.", "action": "A dhyāna of Agni / the Yajña-puruṣa, recited in the fire worship. (Preceded by a prayer: \"*agne … gotra vaiśvānara meṣārūḍha varaprada prāṅmukho deva mama sammukho varado bhava*.\")", "audio": "audio/080-agnim-prajvalitam-vande.wav", "cat": "japa"}, {"id": 81, "slug": "yajnopavitam-paramam-pavitram", "title": "Yajñopavītaṃ Paramaṃ Pavitram", "chapter": "Daily duties — Yajñopavīta-dhāraṇam", "book_page": "92", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं यज्ञोपवीतं परमं पवित्रं प्रजापतेर्यत्सहजं पुरस्तात् ।", "आयुष्यमग्र्यं प्रतिमुञ्च शुभ्रं यज्ञोपवीतं बलमस्तु तेजः । ओं ।"], "iast": ["oṃ yajñopavītaṃ paramaṃ pavitraṃ prajāpateryatsahajaṃ purastāt ।", "āyuṣyamagryaṃ pratimuñca śubhraṃ yajñopavītaṃ balamastu tejaḥ । oṃ ।"], "meaning": "The sacred thread (yajñopavīta) is supremely pure, born with Prajāpati of old. Put on this bright thread that bestows long life and is foremost; may the yajñopavīta be strength and lustre to me.", "action": "Recited when wearing the sacred thread (utter three times and put it on); then perform ācamana and japa the Gāyatrī ten times. Viniyoga: *yajñopavītamityasya mantrasya parabrahma ṛṣiḥ; triṣṭup chandaḥ; paramātmā devatā; upavītadhāraṇe viniyogaḥ.*", "audio": "audio/081-yajnopavitam-paramam-pavitram.wav", "cat": "japa"}, {"id": 82, "slug": "sri-sukta", "title": "Śrī Sūkta (opening verses)", "chapter": "Daily / Lakṣmī pūjā — Śrī Sūkta", "book_page": "97", "meter": "anuṣṭubh", "tts_skip": true, "tts_note": "", "devanagari": ["हिरण्यवर्णां हरिणीं सुवर्णरजतस्रजाम् ।", "चन्द्रां हिरण्मयीं लक्ष्मीं जातवेदो म आवह ॥", "तां म आवह जातवेदो लक्ष्मीमनपगामिनीम् ।", "यस्यां हिरण्यं विन्देयं गामश्वं पुरुषानहम् ॥", "अश्वपूर्वां रथमध्यां हस्तिनादप्रमोदिनीम् ।", "श्रियं देवीमुपह्वये श्रीर्मा देवी जुषताम् ॥", "कां सोस्मितां हिरण्यप्राकारामार्द्रां ज्वलन्तीं तृप्तां तर्पयन्तीम् ।", "पद्मे स्थितां पद्मवर्णां तामिहोपह्वये श्रियम् ॥"], "iast": ["hiraṇyavarṇāṃ hariṇīṃ suvarṇarajatasrajām ।", "candrāṃ hiraṇmayīṃ lakṣmīṃ jātavedo ma āvaha ॥", "tāṃ ma āvaha jātavedo lakṣmīmanapagāminīm ।", "yasyāṃ hiraṇyaṃ vindeyaṃ gāmaśvaṃ puruṣānaham ॥", "aśvapūrvāṃ rathamadhyāṃ hastinādapramodinīm ।", "śriyaṃ devīmupahvaye śrīrmā devī juṣatām ॥", "kāṃ sosmitāṃ hiraṇyaprākārāmārdrāṃ jvalantīṃ tṛptāṃ tarpayantīm ।", "pa
