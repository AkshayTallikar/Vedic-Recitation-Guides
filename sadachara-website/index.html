dme sthitāṃ padmavarṇāṃ tāmihopahvaye śriyam ॥"], "meaning": "O Jātavedas (Agni), summon for me Lakṣmī — golden-hued, fawn-like, garlanded with gold and silver, moon-bright, made of gold. Summon for me that Lakṣmī who never departs, by whom I may obtain gold, cattle, horses and people. Heralded by horses, with chariots in her midst, delighting in the trumpeting of elephants — I invoke the goddess Śrī; may the goddess Śrī favour me. The gently-smiling one, ringed with gold, moist (compassionate), blazing, contented and contenting, seated on a lotus and lotus-hued — that Śrī I invoke here.", "action": "The opening verses of the **Śrī Sūkta** (a fifteen-verse hymn to Lakṣmī, ṛṣis Ānanda-Kardama-Śrīda-Ciklīta, the children of Indirā; devatā Śrī), recited in Lakṣmī worship. Continues with \"*candrāṃ prabhāsāṃ yaśasā jvalantīm…*\", \"*ādityavarṇe tapaso'dhijāto…*\", etc.", "audio": null, "cat": "sukta"}, {"id": 83, "slug": "devi-sukta-aham-rudrebhih", "title": "Devī Sūkta — Ahaṃ Rudrebhiḥ (opening verses)", "chapter": "Vedic sūktas — Devī (Ambhṛṇī) Sūkta", "book_page": "113", "meter": "gadya", "tts_skip": true, "tts_note": "", "devanagari": ["अहं रुद्रेभिर्वसुभिश्चराम्यहमादित्यैरुत विश्वदेवैः ।", "अहं मित्रावरुणोभा बिभर्म्यहमिन्द्राग्नी अहमश्विनोभा ॥", "अहं सोममाहनसं बिभर्म्यहं त्वष्टारमुत पूषणं भगम् ।", "अहं दधामि द्रविणं हविष्मते सुप्राव्ये यजमानाय सुन्वते ॥"], "iast": ["ahaṃ rudrebhirvasubhiścarāmyahamādityairuta viśvadevaiḥ ।", "ahaṃ mitrāvaruṇobhā bibharmyahamindrāgnī ahamaśvinobhā ॥", "ahaṃ somamāhanasaṃ bibharmyahaṃ tvaṣṭāramuta pūṣaṇaṃ bhagam ।", "ahaṃ dadhāmi draviṇaṃ haviṣmate suprāvye yajamānāya sunvate ॥"], "meaning": "I move with the Rudras and the Vasus, with the Ādityas and the All-Gods; I uphold both Mitra and Varuṇa, both Indra and Agni, both the Aśvins. I bear the swelling Soma, and Tvaṣṭṛ, Pūṣan and Bhaga; I bestow wealth on the devout sacrificer who presses Soma and offers oblation.", "action": "The opening of the **Devī Sūkta** (Ambhṛṇī Sūkta, RV 10.125), in which the Goddess (Vāk / Mahālakṣmī) declares her all-pervading sovereignty. Recited in Devī worship. Viniyoga: *ahaṃ rudreti mantrasya lakṣmī ṛṣiḥ; triṣṭup (dvitīya jagatī) chandaḥ; mahālakṣmīr devatā; abhiṣeke viniyogaḥ.* (Continues for eight verses.)", "audio": null, "cat": "sukta"}, {"id": 84, "slug": "tulasi-dhyana", "title": "Tulasī Dhyāna — Dhyāyāmi Tulasīṃ Devīṃ", "chapter": "Festivals — Tulasī Pūjā", "book_page": "275", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ध्यायामि तुलसीं देवीं श्यामां कमललोचनाम् ।", "प्रसन्नां पद्मकह्लारवराभयचतुर्भुजाम् ॥", "किरीटहारकेयूरकुण्डलादिविभूषिताम् ।", "धवलांशुकसंयुक्तां पद्मासननिषेदुषीम् ॥"], "iast": ["dhyāyāmi tulasīṃ devīṃ śyāmāṃ kamalalocanām ।", "prasannāṃ padmakahlāravarābhayacaturbhujām ॥", "kirīṭahārakeyūrakuṇḍalādivibhūṣitām ।", "dhavalāṃśukasaṃyuktāṃ padmāsananiṣeduṣīm ॥"], "meaning": "I meditate on the goddess Tulasī — dark-hued, lotus-eyed, serene, four-armed, holding lotus and white-lily and showing the boon and abhaya gestures; adorned with crown, garland, armlets, earrings and other ornaments; clad in white garments, seated upon a lotus.", "action": "The dhyāna of Tulasī, recited in the **Tulasī Pūjā** (celebrated from Kārtika śukla pādya to dvādaśī, after the daily evening pūjā). Perform śaṅkha-pūjā, ṣṭha-pūjā, pūjā to the Lord with the Puruṣa Sūkta, then chant \"gaṅge ca yamune caiva…\" and worship Tulasī.", "audio": "audio/084-tulasi-dhyana.wav", "cat": "festival"}, {"id": 85, "slug": "janmashtami-jatah-kamsavadharthaya", "title": "Jātaḥ Kaṃsavadhārthāya (Janmāṣṭamī arghya)", "chapter": "Festivals — Śrī Kṛṣṇa Janmāṣṭamī", "book_page": "257", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["जातः कंसवधार्थाय भूभारहरणाय च ।", "कौरवाणां विनाशाय दैत्यानां निधनाय च ॥", "पाण्डवानां हितार्थाय धर्मसंस्थापनाय च ।", "गृहाणार्घ्यं मया दत्तं देवक्या सहितो हरे ॥"], "iast": ["jātaḥ kaṃsavadhārthāya bhūbhāraharaṇāya ca ।", "kauravāṇāṃ vināśāya daityānāṃ nidhanāya ca ॥", "pāṇḍavānāṃ hitārthāya dharmasaṃsthāpanāya ca ।", "gṛhāṇārghyaṃ mayā dattaṃ devakyā sahito hare ॥"], "meaning": "O Hari, born to slay Kaṃsa and to relieve the earth of its burden; to destroy the Kauravas and to slaughter the demons; for the welfare of the Pāṇḍavas and the re-establishment of dharma — accept this arghya offered by me, together with Devakī.", "action": "The arghya mantra of **Śrī Kṛṣṇa Janmāṣṭamī**. Chant it and offer arghya — \"*devakīsahita śrīkṛṣṇāya idamarghyam*\" — pouring water three times. (Worship Kṛṣṇa, Balabhadra, Vasudeva, Devakī, Yaśodā, Nandagopa and Subhadrā; perform archana with bilva-patra.)", "audio": "audio/085-janmashtami-jatah-kamsavadharthaya.wav", "cat": "festival"}, {"id": 86, "slug": "brahmapara-stotra", "title": "Brahmapāra Stotra", "chapter": "Lakṣmī pūjā — Brahmapāra Stotra", "book_page": "116", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ब्रह्मपारं मुने श्रोतुमिच्छामः परमं स्तवम् ।", "जपता कण्डुना देवो येनाराध्यत केशवः ॥१॥", "पारं परं विष्णुरपारपारः परः परेभ्यः परमार्थरूपी ।", "स ब्रह्मपारः परपारभूतः परः पराणामपि पारपारः ॥२॥", "स कारणं कारणतस्ततोऽपि तस्यापि हेतुः परहेतुहेतुः ।", "कार्येषु चैवं स ह कर्मकर्तृरूपैरशेषैरवतीह सर्वम् ॥३॥", "स ब्रह्मभूर्ब्रह्म स सर्वभूतो ब्रह्मप्रजानां पतिरच्युतोऽसौ ।", "ब्रह्माव्ययं नित्यमजं स विष्णुरपक्षयाद्यैरखिलैरसङ्गि ॥४॥", "ब्रह्माक्षरमजं नित्यं यथासौ पुरुषोत्तमः ।", "तथा रागादयो दोषाः प्रयान्तु प्रशमं मम ॥५॥", "एतद्वै ब्रह्मपाराख्यं संस्तवं परमं जपन् ।", "अवाप परमां सिद्धिं स समाराध्य केशवम् ॥६॥"], "iast": ["brahmapāraṃ mune śrotumicchāmaḥ paramaṃ stavam ।", "japatā kaṇḍunā devo yenārādhyata keśavaḥ ॥1॥", "pāraṃ paraṃ viṣṇurapārapāraḥ paraḥ parebhyaḥ paramārtharūpī ।", "sa brahmapāraḥ parapārabhūtaḥ paraḥ parāṇāmapi pārapāraḥ ॥2॥", "sa kāraṇaṃ kāraṇatastato'pi tasyāpi hetuḥ parahetuhetuḥ ।", "kāryeṣu caivaṃ sa ha karmakartṛrūpairaśeṣairavatīha sarvam ॥3॥", "sa brahmabhūrbrahma sa sarvabhūto brahmaprajānāṃ patiracyuto'sau ।", "brahmāvyayaṃ nityamajaṃ sa viṣṇurapakṣayādyairakhilairasaṅgi ॥4॥", "brahmākṣaramajaṃ nityaṃ yathāsau puruṣottamaḥ ।", "tathā rāgādayo doṣāḥ prayāntu praśamaṃ mama ॥5॥", "etadvai brahmapārākhyaṃ saṃstavaṃ paramaṃ japan ।", "avāpa paramāṃ siddhiṃ sa samārādhya keśavam ॥6॥"], "meaning": "(Pracetas said:) \"O sage, we wish to hear that supreme hymn called *Brahmapāra*, by reciting which the sage Kaṇḍu propitiated Lord Keśava.\" (Soma replied:) Viṣṇu is the far shore beyond the far shore, supreme, beyond even the highest, the very form of the ultimate truth. He is the far shore of Brahman, become the far shore beyond every far shore, supreme, the very far shore of the highest things. He is the cause behind every cause, the source even of that source, the very ground of the highest ground. In all effects He, through the forms of every doer and deed without exception, pervades the whole right here. He is the become-Brahman who is Brahman itself, become all beings, the imperishable Lord of Brahmā's progeny; the undecaying, unborn, eternal Brahman — that Viṣṇu untouched by decay and every limitation. Just as He is the imperishable, unborn, eternal Puruṣottama — so may my faults, passion and the rest, come to quietude. Reciting this supreme hymn named Brahmapāra, he (Kaṇḍu), having worshipped Keśava, attained the highest perfection.", "action": "A stuti to Viṣṇu/Keśava recited during Lakṣmī pūjā (chanted, per the text, before the main pūjā begins, after sandhyāvandana and the offering of gandha/tulasī). The hymn plays throughout on *pāra/para* — \"the supreme one beyond every shore.\" (Note: verses 2–4 are in the eleven-syllable triṣṭubh/upajāti metre; verses 1, 5, 6 in anuṣṭubh — split accordingly when rendering audio.)", "audio": "audio/086-brahmapara-stotra.wav", "cat": "puja"}, {"id": 87, "slug": "ashtapushpa-ahimsa-prathamam", "title": "Aṣṭapuṣpa — Ahiṃsā Prathamaṃ Puṣpaṃ", "chapter": "Pūjā prārthanā — the eight flowers", "book_page": "118", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["अहिंसा प्रथमं पुष्पं पुष्पमिन्द्रियनिग्रहः ।", "सर्वभूतदयापुष्पं सत्यपुष्पं विशेषतः ॥", "ज्ञानपुष्पं तपःपुष्पं क्रियापुष्पं तथैव च ।", "ध्यानं चैवाष्टमं पुष्पं पुष्पैस्तुष्यति केशवः ॥"], "iast": ["ahiṃsā prathamaṃ puṣpaṃ puṣpamindriyanigrahaḥ ।", "sarvabhūtadayāpuṣpaṃ satyapuṣpaṃ viśeṣataḥ ॥", "jñānapuṣpaṃ tapaḥpuṣpaṃ kriyāpuṣpaṃ tathaiva ca ।", "dhyānaṃ caivāṣṭamaṃ puṣpaṃ puṣpaistuṣyati keśavaḥ ॥"], "meaning": "Non-violence is the first flower; restraint of the senses a flower; compassion to all beings a flower; truth, above all, a flower. Knowledge a flower, austerity a flower, right action likewise a flower, and meditation the eighth flower — with these flowers Keśava is pleased.", "action": "Recited as the prārthanā (prayer) at the start of worship, declaring that the truest offering to the Lord is inner virtue — the 'eight flowers' — rather than mere material flowers.", "audio": "audio/087-ashtapushpa-ahimsa-prathamam.wav", "cat": "puja"}, {"id": 88, "slug": "namostvanantaya-sahasramurtaye", "title": "Namo'stvanantāya Sahasramūrtaye", "chapter": "Pūjā prārthanā — Ananta praṇāma", "book_page": "119", "meter": "vaṃśastha", "tts_skip": false, "tts_note": "", "devanagari": ["नमोऽस्त्वनन्ताय सहस्रमूर्तये सहस्रपादाक्षिशिरोरुबाहवे ।", "सहस्रनाम्ने पुरुषाय शाश्वते सहस्रकोटीयुगधारिणे नमः ॥"], "iast": ["namo'stvanantāya sahasramūrtaye sahasrapādākṣiśirorubāhave ।", "sahasranāmne puruṣāya śāśvate sahasrakoṭīyugadhāriṇe namaḥ ॥"], "meaning": "Salutations to the Infinite One of a thousand forms, of a thousand feet, eyes, heads and arms; to the Puruṣa of a thousand names, the eternal one who upholds a thousand crore ages — salutations.", "action": "A praṇāma to the cosmic, infinite form of Viṣṇu (Ananta), offered during worship.", "audio": "audio/088-namostvanantaya-sahasramurtaye.wav", "cat": "puja"}, {"id": 89, "slug": "namo-brahmanyadevaya", "title": "Namo Brahmaṇyadevāya", "chapter": "Pūjā prārthanā — Kṛṣṇa praṇāma", "book_page": "119", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["नमो ब्रह्मण्यदेवाय गोब्राह्मणहिताय च ।", "जगद्धिताय कृष्णाय गोविन्दाय नमो नमः ॥"], "iast": ["namo brahmaṇyadevāya gobrāhmaṇahitāya ca ।", "jagaddhitāya kṛṣṇāya govindāya namo namaḥ ॥"], "meaning": "Salutations to the God devoted to the brahmins, to the benefactor of cows and brahmins, to the well-wisher of the whole world — to Kṛṣṇa, to Govinda, salutations again and again.", "action": "The well-known Kṛṣṇa praṇāma mantra, recited in worship as a salutation to Kṛṣṇa-Govinda.", "audio": "audio/089-namo-brahmanyadevaya.wav", "cat": "puja"}, {"id": 90, "slug": "dvarapala-vandana-nandam-sunandam", "title": "Dvārapāla Vandana — Nandaṃ Sunandaṃ", "chapter": "Pūjā — Dvārapālavandanam", "book_page": "119", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["नन्दं सुनन्दं गरुडं प्रचण्डं चण्डमेव च ।", "जयं च विजयं चैव कुमुदं कुमुदेक्षणम् ॥"], "iast": ["nandaṃ sunandaṃ garuḍaṃ pracaṇḍaṃ caṇḍameva ca ।", "jayaṃ ca vijayaṃ caiva kumudaṃ kumudekṣaṇam ॥"], "meaning": "(Salutations to) Nanda, Sunanda, Garuḍa, Pracaṇḍa and Caṇḍa, Jaya and Vijaya, Kumuda and Kumudekṣaṇa.", "action": "The Dvārapāla-vandanam — salutation to the eight gatekeepers of Viṣṇu's abode (Vaikuṇṭha), offered along with worship of Śrī-Lakṣmī at the threshold before entering the main pūjā. (Preceded by 'śrī śriyai namaḥ'.)", "audio": "audio/090-dvarapala-vandana-nandam-sunandam.wav", "cat": "puja"}, {"id": 91, "slug": "narayanaya-paripurnaguna", "title": "Nārāyaṇāya Paripūrṇaguṇārṇavāya", "chapter": "Pūjā — Nārāyaṇa dhyāna", "book_page": "120", "meter": "vasantatilakā", "tts_skip": false, "tts_note": "", "devanagari": ["नारायणाय परिपूर्णगुणार्णवाय विश्वोदयस्थितिलयोनियतिप्रदाय ।", "ज्ञानप्रदाय विबुधासुरसौख्यदुःखसत्कारणाय वितताय नमो नमस्ते ॥"], "iast": ["nārāyaṇāya paripūrṇaguṇārṇavāya viśvodayasthitilayoniyatipradāya ।", "jñānapradāya vibudhāsurasaukhyaduḥkhasatkāraṇāya vitatāya namo namaste ॥"], "meaning": "To Nārāyaṇa, the ocean of perfect and complete auspicious qualities; the giver of the world's arising, sustenance, dissolution and ordering; the bestower of knowledge; the true cause of happiness to the gods and sorrow to the demons; the all-pervading one — salutations, salutations to You.", "action": "A dhyāna verse meditating on Nārāyaṇa as the storehouse of perfect attributes and the creator-sustainer-dissolver of the universe, recited before offering salutations to the guru.", "audio": "audio/091-narayanaya-paripurnaguna.wav", "cat": "puja"}, {"id": 92, "slug": "madhva-pranama-yo-vipralambha", "title": "Madhva Praṇāma — Yo Vipralambha", "chapter": "Guru vandana — Madhvācārya", "book_page": "120", "meter": "vasantatilakā", "tts_skip": false, "tts_note": "", "devanagari": ["यो विप्रलम्भविपरीतमतिप्रभूतवादान्निरस्य कृतवान् भुवि तत्त्ववादम् ।", "सर्वेश्वरो हरिरिति प्रतिपादयन्तमानन्दतीर्थमुनिवर्यमहं नमामि ॥"], "iast": ["yo vipralambhaviparītamatiprabhūtavādānnirasya kṛtavān bhuvi tattvavādam ।", "sarveśvaro haririti pratipādayantamānandatīrthamunivaryamahaṃ namāmi ॥"], "meaning": "He who, dispelling the prolific doctrines born of deluded and perverse intellects, established Tattvavāda (the philosophy of reality) upon the earth, and who demonstrated that Hari is the Lord of all — that foremost of sages, Ānandatīrtha (Madhvācārya), I salute.", "action": "Salutation to Śrī Madhvācārya (Ānandatīrtha), offered after the Nārāyaṇa dhyāna, before commencing the pūjā.", "audio": "audio/092-madhva-pranama-yo-vipralambha.wav", "cat": "puja"}, {"id": 93, "slug": "manasan-vacikan-doshan", "title": "Mānasān Vācikān Doṣān", "chapter": "Guru vandana — kṣamāpaṇa to Madhva", "book_page": "121", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["मानसान् वाचिकान् दोषान् कायिकानपि सर्वदा ।", "वैष्णवद्वेषसंहेतून्मे भस्मसात् कुरु माधव ॥"], "iast": ["mānasān vācikān doṣān kāyikānapi sarvadā ।", "vaiṣṇavadveṣasaṃhetūnme bhasmasāt kuru mādhava ॥"], "meaning": "O Mādhava, reduce to ashes all my faults — of mind, of speech, and of body — that ever arise as enmity toward the Vaiṣṇavas (devotees of the Lord).", "action": "A prayer to Madhva (Mādhava) to expiate one's sins, especially wrong thoughts, words and deeds against the Lord's devotees, recited as part of the guru-vandana.", "audio": "audio/093-manasan-vacikan-doshan.wav", "cat": "puja"}, {"id": 94, "slug": "ayatabhyam-vishalabhyam", "title": "Āyatābhyāṃ Viśālābhyāṃ", "chapter": "Pūjā prārthanā — prayer for grace", "book_page": "121", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["आयताभ्यां विशालाभ्यां शीतलाभ्यां कृपानिधे ।", "करुणासरपूर्णाभ्यां लोचनाभ्यां विलोकय ॥"], "iast": ["āyatābhyāṃ viśālābhyāṃ śītalābhyāṃ kṛpānidhe ।", "karuṇāsarapūrṇābhyāṃ locanābhyāṃ vilokaya ॥"], "meaning": "O ocean of compassion, look upon me with those eyes of Yours — long, wide, cool, and brimming with the nectar of mercy.", "action": "A prayer pleading with the Lord (the ocean of kindness) to cast His compassionate glance upon the worshipper.", "audio": "audio/094-ayatabhyam-vishalabhyam.wav", "cat": "puja"}, {"id": 95, "slug": "satpatragandhapushpadyair-anujna", "title": "Satpatragandhapuṣpādyair (Anujñā)", "chapter": "Pūjā — anujñā before worship", "book_page": "121", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["सत्पत्रगन्धपुष्पाद्यैरर्चयामि यथा हरे ।", "अनुज्ञां देहि देवेश संसारार्तिनिवृत्तये ॥"], "iast": ["satpatragandhapuṣpādyairarcayāmi yathā hare ।", "anujñāṃ dehi deveśa saṃsārārtinivṛttaye ॥"], "meaning": "O Hari, as I worship You with sacred leaves, sandal, flowers and the rest, grant me, O Lord of gods, Your permission — for the cessation of the affliction of saṃsāra.", "action": "The anujñā (seeking the Lord's leave) recited just before beginning the pūjā with leaves, gandha and flowers, praying to cross the ocean of worldly suffering.", "audio": "audio/095-satpatragandhapushpadyair-anujna.wav", "cat": "puja"}, {"id": 96, "slug": "aradhyase-pranabhrtam", "title": "Ārādhyase Prāṇabhṛtāṃ Praṇetrā", "chapter": "Pūjā prārthanā — Lakṣmīnārāyaṇa", "book_page": "125", "meter": "upajāti", "tts_skip": false, "tts_note": "", "devanagari": ["आराध्यसे प्राणभृतां प्रणेत्रा प्राणाधिनाथेन समीरणेन ।", "नारायण ज्ञानसुखैकपूर्ण स्वामिन् मम श्रीरमण प्रसीद ॥"], "iast": ["ārādhyase prāṇabhṛtāṃ praṇetrā prāṇādhināthena samīraṇena ।", "nārāyaṇa jñānasukhaikapūrṇa svāmin mama śrīramaṇa prasīda ॥"], "meaning": "You are worshipped by Vāyu (Samīraṇa), the leader and lord of all living beings' vital breath. O Nārāyaṇa, full of the one bliss that is knowledge, my Lord, beloved of Śrī — be gracious to me.", "action": "Recited just before the pūjā: an acknowledgement that it is truly Mukhyaprāṇa (Vāyu, the jīvottama) within who performs the worship of Lakṣmīnārāyaṇa, with a prayer for the Lord's grace.", "audio": "audio/096-aradhyase-pranabhrtam.wav", "cat": "puja"}, {"id": 97, "slug": "agamartham-ghanta", "title": "Āgamārthaṃ Tu Devānāṃ (Ghaṇṭā)", "chapter": "Pūjā — Ghaṇṭāvādanam (bell)", "book_page": "126", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["आगमार्थं तु देवानां गमनार्थं तु रक्षसाम् ।", "कुरु घण्टारवं तत्र देवताह्वानलाञ्छनम् ॥"], "iast": ["āgamārthaṃ tu devānāṃ gamanārthaṃ tu rakṣasām ।", "kuru ghaṇṭāravaṃ tatra devatāhvānalāñchanam ॥"], "meaning": "For the coming of the gods and for the departure of the demons, ring the bell there — the sign that summons the deities.", "action": "Recited while ringing the bell (ghaṇṭā) at the start of pūjā, to welcome the deities and drive away malign forces.", "audio": "audio/097-agamartham-ghanta.wav", "cat": "puja"}, {"id": 98, "slug": "prasida-tulasi-devi", "title": "Prasīda Tulasī Devi (Tulasī Prārthanā)", "chapter": "Pūjā — Tulasīprārthanā", "book_page": "127", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["प्रसीद तुलसी देवि प्रसीद हरिवल्लभे ।", "क्षीरोदमथनोद्भूते तुलसि त्वां नमाम्यहम् ॥"], "iast": ["prasīda tulasī devi prasīda harivallabhe ।", "kṣīrodamathanodbhūte tulasi tvāṃ namāmyaham ॥"], "meaning": "Be gracious, O goddess Tulasī; be gracious, O beloved of Hari. O Tulasī, arisen from the churning of the ocean of milk, I bow to you.", "action": "The Tulasī-prārthanā, recited while gathering tulasī leaves for the worship.", "audio": "audio/098-prasida-tulasi-devi.wav", "cat": "puja"}, {"id": 99, "slug": "shankha-stuti-tvam-pura-sagarotpanno", "title": "Śaṅkha Stuti — Tvaṃ Purā Sāgarotpanno", "chapter": "Pūjā — Śaṅkhapūjā (Pāñcajanya)", "book_page": "127", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["त्वं पुरा सागरोत्पन्नो विष्णुना विधृतः करे ।", "नमितः सर्वदेवैश्च पाञ्चजन्य नमोऽस्तु ते ॥", "गर्भादेवारिनारीणां विशीर्यन्ते सहस्रधा ।", "तव नादेन पाताले पाञ्चजन्य नमोऽस्तु ते ॥", "दर्शनादेव शङ्खस्य किं पुनः स्पर्शनेन च ।", "विलयं यान्ति पापानि तमः सूर्योदये यथा ॥", "नत्वा शङ्खं करे स्पृष्ट्वा मन्त्रेणानेन वैष्णवः ।", "यः स्नापयति गोविन्दं तस्य पुण्यमनन्तकम् ॥", "शङ्खं चन्द्रार्कदैवत्यं मध्ये वरुणदैवतम् ।", "पृष्ठे प्रजापतिर्वेदा अग्रे गङ्गा सरस्वती ॥", "त्रैलोक्ये यानि तीर्थानि वासुदेवस्य चाज्ञया ।", "शङ्खे तिष्ठन्ति विप्रेन्द्र तस्माच्छङ्खं प्रपूजयेत् ॥"], "iast": ["tvaṃ purā sāgarotpanno viṣṇunā vidhṛtaḥ kare ।", "namitaḥ sarvadevaiśca pāñcajanya namo'stu te ॥", "garbhādevārinārīṇāṃ viśīryante sahasradhā ।", "tava nādena pātāle pāñcajanya namo'stu te ॥", "darśanādeva śaṅkhasya kiṃ punaḥ sparśanena ca ।", "vilayaṃ yānti pāpāni tamaḥ sūryodaye yathā ॥", "natvā śaṅkhaṃ kare spṛṣṭvā mantreṇānena vaiṣṇavaḥ ।", "yaḥ snāpayati govindaṃ tasya puṇyamanantakam ॥", "śaṅkhaṃ candrārkadaivatyaṃ madhye varuṇadaivatam ।", "pṛṣṭhe prajāpatirvedā agre gaṅgā sarasvatī ॥", "trailokye yāni tīrthāni vāsudevasya cājñayā ।", "śaṅkhe tiṣṭhanti viprendra tasmācchaṅkhaṃ prapūjayet ॥"], "meaning": "O Pāñcajanya, you were born of old from the ocean and are held in Viṣṇu's hand; bowed to by all the gods — salutations to you. At your sound in the netherworld the wombs of the demon-women miscarry a thousandfold; O Pāñcajanya, salutations to you. If the mere sight of the divine conch (destroys sin), how much more its touch! Sins dissolve as darkness does at sunrise. When a Vaiṣṇava, having bowed and touched the conch with this mantra, bathes Govinda (with its water), his merit is endless. The conch has the sun and moon as its presiding deities, Varuṇa in its middle, Prajāpati and the Vedas at its back, and Gaṅgā and Sarasvatī at its mouth. All the sacred fords (tīrthas) of the three worlds, by Vāsudeva's command, abide within the conch — therefore, O best of brahmins, one should worship the conch.", "action": "The Śaṅkha-stuti, recited during śaṅkhapūjā while honoring and filling the conch with water for the Lord's abhiṣeka.", "audio": "audio/099-shankha-stuti-tvam-pura-sagarotpanno.wav", "cat": "puja"}, {"id": 100, "slug": "apavitrah-pavitro-va", "title": "Apavitraḥ Pavitro Vā", "chapter": "Pūjā — pavitrīkaraṇa (purification)", "book_page": "130", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा ।", "यः स्मरेत् पुण्डरीकाक्षं स बाह्याभ्यन्तरः शुचिः ॥"], "iast": ["apavitraḥ pavitro vā sarvāvasthāṃ gato'pi vā ।", "yaḥ smaret puṇḍarīkākṣaṃ sa bāhyābhyantaraḥ śuciḥ ॥"], "meaning": "Whether impure or pure, or in whatever condition one may be — whoever remembers the lotus-eyed Lord (Viṣṇu) becomes pure within and without.", "action": "The pavitrīkaraṇa verse, recited (sprinkling water with tulasī) to purify oneself and the articles of worship before the pūjā.", "audio": "audio/100-apavitrah-pavitro-va.wav", "cat": "puja"}, {"id": 101, "slug": "kalasasya-mukhe-vishnuh", "title": "Kalaśasya Mukhe Viṣṇuḥ", "chapter": "Pūjā — Kalaśapūjā", "book_page": "132", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["कलशस्य मुखे विष्णुः कण्ठे रुद्रः समाश्रिताः ।", "मूले तत्र स्थितो ब्रह्मा मध्ये मातृगणाः स्मृताः ॥", "कुक्षौ तु सागराः सर्वे सप्तद्वीपा वसुन्धरा ।", "ऋग्वेदोऽथ यजुर्वेदः सामवेदो ह्यथर्वणः ॥", "अङ्गैश्च सहिताः सर्वे कलशाम्बुसमाश्रिताः ॥"], "iast": ["kalaśasya mukhe viṣṇuḥ kaṇṭhe rudraḥ samāśritāḥ ।", "mūle tatra sthito brahmā madhye mātṛgaṇāḥ smṛtāḥ ॥", "kukṣau tu sāgarāḥ sarve saptadvīpā vasundharā ।", "ṛgvedo'tha yajurvedaḥ sāmavedo hyatharvaṇaḥ ॥", "aṅgaiśca sahitāḥ sarve kalaśāmbusamāśritāḥ ॥"], "meaning": "At the mouth of the kalaśa (water-pot) abides Viṣṇu, at its neck Rudra, at its base Brahmā, and in its middle the Mother-goddesses. Within its belly are all the oceans, the seven continents and the earth; the Ṛgveda, Yajurveda, Sāmaveda and Atharvaveda — all, together with their auxiliaries (aṅgas), abide in the water of the kalaśa.", "action": "The kalaśa-pūjā dhyāna, recited while touching the consecrated water-pots, invoking all the deities, oceans and Vedas into the sacred water. (Followed by 'gaṅge ca yamune…' = shloka 011.)", "audio": "audio/101-kalasasya-mukhe-vishnuh.wav", "cat": "puja"}, {"id": 102, "slug": "kalasah-kirtimayusca", "title": "Kalaśaḥ Kīrtimāyuśca", "chapter": "Pūjā — Kalaśapūjā (phala)", "book_page": "138", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["कलशः कीर्तिमायुश्च प्रज्ञां मेधां श्रियं भगम् ।", "योग्यतां पापहानिं च पुण्यवृद्धिं च साधयेत् ॥"], "iast": ["kalaśaḥ kīrtimāyuśca prajñāṃ medhāṃ śriyaṃ bhagam ।", "yogyatāṃ pāpahāniṃ ca puṇyavṛddhiṃ ca sādhayet ॥"], "meaning": "May the (worshipped) kalaśa bestow fame and long life, intelligence, retentive wisdom, prosperity and fortune; worthiness, the removal of sins, and the increase of merit.", "action": "The concluding phala-verse of the kalaśa-pūjā, recited to invoke the benefits the consecrated water-pot confers, before its water is used in the worship.", "audio": "audio/102-kalasah-kirtimayusca.wav", "cat": "puja"}, {"id": 103, "slug": "bho-svamin-jagatam-natha", "title": "Bho Svāmin Jagatāṃ Nātha", "chapter": "Pūjā — āvāhana-sthāpana", "book_page": "147", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["भो स्वामिन् जगतां नाथ यावत्पूजासमाप्तनम् ।", "तावत्सम्प्रीतिभावेन बिम्बेऽस्मिन् संस्थितो भव ॥"], "iast": ["bho svāmin jagatāṃ nātha yāvatpūjāsamāptanam ।", "tāvatsamprītibhāvena bimbe'smin saṃsthito bhava ॥"], "meaning": "O Lord, Master of the worlds — until the worship is completed, so long, with loving favour, remain present in this sacred image.", "action": "The āvāhana-sthāpana prayer, requesting the Lord (after being invoked from one's heart into the image) to remain present in the icon for the duration of the pūjā.", "audio": "audio/103-bho-svamin-jagatam-natha.wav", "cat": "puja"}, {"id": 104, "slug": "dhupa-vanaspatirasotpanno", "title": "Dhūpa — Vanaspatirasotpanno", "chapter": "Pūjā — Dhūpa offering", "book_page": "175", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["वनस्पतिरसोत्पन्नो गन्धाढ्यो धूप उत्तमः ।", "आघ्रेयः सर्वदेवानां धूपोऽयं प्रतिगृह्यताम् ॥"], "iast": ["vanaspatirasotpanno gandhāḍhyo dhūpa uttamaḥ ।", "āghreyaḥ sarvadevānāṃ dhūpo'yaṃ pratigṛhyatām ॥"], "meaning": "Arisen from the sap of plants, rich in fragrance, the finest incense — fit to be smelled by all the gods: may this incense be accepted.", "action": "Recited while offering dhūpa (incense) to the Lord during the pūjā upacāras.", "audio": "audio/104-dhupa-vanaspatirasotpanno.wav", "cat": "puja"}, {"id": 105, "slug": "dipa-jyotih-shukram", "title": "Dīpa — Jyotiḥ Śukraṃ Tejasvī", "chapter": "Pūjā — Dīpa offering", "book_page": "175", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ज्योतिः शुक्रं तेजस्वी देवानां सततं प्रियः ।", "प्रभाकरो महातेजा दीपोऽयं प्रतिगृह्यताम् ॥"], "iast": ["jyotiḥ śukraṃ tejasvī devānāṃ satataṃ priyaḥ ।", "prabhākaro mahātejā dīpo'yaṃ pratigṛhyatām ॥"], "meaning": "Bright, pure and radiant, ever dear to the gods, luminous and of great brilliance — may this lamp be accepted.", "action": "Recited while offering dīpa (the lamp) to the Lord. (The lamp is shown but not waved as āratī here, and is snuffed out by the worshipper, not by breath.)", "audio": "audio/105-dipa-jyotih-shukram.wav", "cat": "puja"}, {"id": 106, "slug": "mukhyaprana-trini-rupani", "title": "Mukhyaprāṇa — Prathamo Hanūmannāma", "chapter": "Pūjā — Mukhyaprāṇa naivedya", "book_page": "182", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ओं प्रथमो हनूमन्नाम द्वितीयो भीम एव च ।", "पूर्णप्रज्ञस्तृतीयस्तु भगवत्कार्यसाधकः ॥"], "iast": ["oṃ prathamo hanūmannāma dvitīyo bhīma eva ca ।", "pūrṇaprajñastṛtīyastu bhagavatkāryasādhakaḥ ॥"], "meaning": "The first (incarnation of Mukhyaprāṇa/Vāyu) bore the name Hanumān, the second was indeed Bhīma, and the third is Pūrṇaprajña (Madhvācārya) — the accomplisher of the Lord's work.", "action": "Recited while offering naivedya to Śrī Mukhyaprāṇa (Vāyu), invoking his three avatāras — Hanumān, Bhīma and Madhvācārya — as the foremost devotee and doer of God's work. (Followed in the text by a verse of the Vāyu Stuti, *pīṭhe ratnopakḷpte…*, chanted while offering tīrtha thrice.)", "audio": "audio/106-mukhyaprana-trini-rupani.wav", "cat": "puja"}, {"id": 107, "slug": "mangalarati-jayatyajo", "title": "Maṅgalārati — Jayatyajo'khaṇḍaguṇa", "chapter": "Pūjā — Maṅgalārati stuti", "book_page": "184", "meter": "vaṃśastha", "tts_skip": false, "tts_note": "", "devanagari": ["ओं जयत्यजोऽखण्डगुणोरुमण्डलः सदोदितो ज्ञानमरीचिमाली ।", "स्वभक्तहार्दोच्चतमोनिहन्ता व्यासावतारो हरिरात्मभास्करः ॥१॥", "जयत्यजोऽक्षीणसुखात्मबिम्बः स्वैश्वर्यकान्तिप्रततः सदोदितः ।", "स्वभक्तसन्तापदुरिष्टहन्ता रामावतारो हरिरिशचन्द्रमाः ॥२॥", "जयत्यसङ्ख्योरुबलाम्बुपूरो गुणोच्चरत्नाकर आत्मवैभवः ।", "सदा सदात्मज्ञानदीभिराप्यः कृष्णावतारो हरिरेकसागरः ॥३॥", "जयति हरिरचिन्त्यः सर्वदेवैकवन्द्यः परम गुरुरभीष्टावाप्तिदः सज्जनानाम् ।", "निखिलगुणगणार्णो नित्यनिर्मुक्तदोषः सरसिजनयनोऽसौ श्रीपतिर्मानदो नः ॥४॥"], "iast": ["oṃ jayatyajo'khaṇḍaguṇorumaṇḍalaḥ sadodito jñānamarīcimālī ।", "svabhaktahārdoccatamonihantā vyāsāvatāro harirātmabhāskaraḥ ॥1॥", "jayatyajo'kṣīṇasukhātmabimbaḥ svaiśvaryakāntipratataḥ sadoditaḥ ।", "svabhaktasantāpaduriṣṭahantā rāmāvatāro haririśacandramāḥ ॥2॥", "jayatyasaṅkhyorubalāmbupūro guṇoccaratnākara ātmavaibhavaḥ ।", "sadā sadātmajñānadībhirāpyaḥ kṛṣṇāvatāro harirekasāgaraḥ ॥3॥", "jayati hariracintyaḥ sarvadevaikavandyaḥ parama gururabhīṣṭāvāptidaḥ sajjanānām ।", "nikhilaguṇagaṇārṇo nityanirmuktadoṣaḥ sarasijanayano'sau śrīpatirmānado naḥ ॥4॥"], "meaning": "Victory to Hari as **Vyāsa** — the unborn one whose vast orb of qualities is undivided, ever-arisen, garlanded with the rays of knowledge, who destroys the dense darkness in the hearts of His devotees, the self-luminous sun. Victory to Hari as **Rāma** — unborn, His very form pure undecaying bliss, ever radiant with the splendour of His own sovereignty, who slays the suffering and misfortune of His devotees, the Lord who is (like) the moon. Victory to Hari as **Kṛṣṇa** — flooded with the waters of immeasurable, great power, the jewel-ocean of qualities, of self-existent majesty, reached ever through the radiance of constant Self-knowledge, the one shoreless ocean. Victory to **Hari** — the inconceivable, sole adorable of all the gods, the supreme guru who grants the good their desires, the ocean of all hosts of qualities, eternally free of every fault, the lotus-eyed Lord of Śrī who bestows honour upon us.", "action": "The maṅgalārati stuti, chanted while performing the ārati (lamp-waving) at the close of the pūjā — saluting Hari's victorious manifestations as Vyāsa, Rāma and Kṛṣṇa, and as Śrīpati Himself. (Verses 1–3 are in vaṃśastha metre, verse 4 in mālinī.)", "audio": "audio/107-mangalarati-jayatyajo.wav", "cat": "puja"}, {"id": 108, "slug": "yasya-smrtya-ca-namoktya", "title": "Yasya Smṛtyā Ca Nāmoktyā", "chapter": "Pūjā samāpana — completion", "book_page": "192", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["यस्य स्मृत्या च नामोक्त्या तपःपूजाक्रियादिषु ।", "न्यूनं सम्पूर्णतां याति सद्यो वन्दे तमच्युतम् ॥"], "iast": ["yasya smṛtyā ca nāmoktyā tapaḥpūjākriyādiṣu ।", "nyūnaṃ sampūrṇatāṃ yāti sadyo vande tamacyutam ॥"], "meaning": "By the mere remembrance of whom and the utterance of whose name, whatever is deficient in austerities, worship and rites at once attains completeness — that Acyuta I salute.", "action": "Recited at the conclusion of the pūjā to make good any deficiencies in the worship, invoking Acyuta whose remembrance perfects all rites.", "audio": "audio/108-yasya-smrtya-ca-namoktya.wav", "cat": "puja"}, {"id": 109, "slug": "mantrahinam-kriyahinam", "title": "Mantrahīnaṃ Kriyāhīnaṃ", "chapter": "Pūjā samāpana — kṣamāpaṇa", "book_page": "192", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["मन्त्रहीनं क्रियाहीनं भक्तिहीनं जनार्दन ।", "यत्कृतं तु मया देव परिपूर्णं तदस्तु ते ॥"], "iast": ["mantrahīnaṃ kriyāhīnaṃ bhaktihīnaṃ janārdana ।", "yat kṛtaṃ tu mayā deva paripūrṇaṃ tadastu te ॥"], "meaning": "O Janārdana, whatever I have done deficient in mantra, deficient in proper rite, and deficient in devotion — O Lord, may that be (accepted as) complete by You.", "action": "The kṣamāpaṇa (seeking pardon) verse, recited at the close of worship to ask the Lord to accept the imperfect pūjā as complete.", "audio": "audio/109-mantrahinam-kriyahinam.wav", "cat": "puja"}, {"id": 110, "slug": "kayena-vaca-manasendriyair", "title": "Kāyena Vācā Manasendriyairvā", "chapter": "Pūjā samāpana — sarvasamarpaṇa", "book_page": "192", "meter": "upajāti", "tts_skip": false, "tts_note": "", "devanagari": ["कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना वा नुसृष्टभावैः ।", "करोमि यद्यत्सकलं परस्मै नारायणायेति समर्पयामि ॥"], "iast": ["kāyena vācā manasendriyairvā buddhyātmanā vā nusṛṣṭabhāvaiḥ ।", "karomi yadyatsakalaṃ parasmai nārāyaṇāyeti samarpayāmi ॥"], "meaning": "Whatever I do — by body, speech, mind or senses, by intellect or soul, or by the promptings of (my) nature — all of it I offer up to the supreme Nārāyaṇa.", "action": "The sarva-samarpaṇa verse, recited at the end of the pūjā (and of any action), surrendering all of one's deeds to Nārāyaṇa.", "audio": "audio/110-kayena-vaca-manasendriyair.wav", "cat": "puja"}, {"id": 111, "slug": "yani-kani-ca-papani", "title": "Yāni Kāni Ca Pāpāni (Pradakṣiṇa)", "chapter": "Pūjā — Pradakṣiṇanamaskāra", "book_page": "196", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["यानि कानि च पापानि जन्मान्तरकृतानि च ।", "तानि तानि विनश्यन्ति प्रदक्षिणपदे पदे ॥", "तीर्थकोटिसहस्राणि व्रतकोटिशतानि च ।", "नारायणप्रणामस्य कलां नार्हन्ति षोडशीम् ॥"], "iast": ["yāni kāni ca pāpāni janmāntarakṛtāni ca ।", "tāni tāni vinaśyanti pradakṣiṇapade pade ॥", "tīrthakoṭisahasrāṇi vratakoṭiśatāni ca ।", "nārāyaṇapraṇāmasya kalāṃ nārhanti ṣoḍaśīm ॥"], "meaning": "Whatever sins have been committed in this and in other births — all of them perish with every single step of circumambulation. Thousands of crores of pilgrimages and hundreds of crores of vows are not worth even a sixteenth part of a single prostration to Nārāyaṇa.", "action": "Recited while performing pradakṣiṇa (circumambulation) and namaskāra at the close of worship.", "audio": "audio/111-yani-kani-ca-papani.wav", "cat": "puja"}, {"id": 112, "slug": "urasa-shirasa-drshtya-ashtanga", "title": "Urasā Śirasā Dṛṣṭyā (Aṣṭāṅga Praṇāma)", "chapter": "Pūjā — Aṣṭāṅga praṇāma", "book_page": "196", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["उरसा शिरसा दृष्ट्या मनसा वचसा तथा ।", "पद्भ्यां कराभ्यां जानुभ्यां प्रणामोऽष्टाङ्ग ईरितः ॥"], "iast": ["urasā śirasā dṛṣṭyā manasā vacasā tathā ।", "padbhyāṃ karābhyāṃ jānubhyāṃ praṇāmo'ṣṭāṅga īritaḥ ॥"], "meaning": "With the chest, the head, the eyes, the mind and speech, and with the feet, the hands and the knees — such is declared to be the eight-limbed (aṣṭāṅga) prostration.", "action": "Defines and accompanies the sāṣṭāṅga praṇāma — the full eight-limbed prostration offered to the Lord.", "audio": "audio/112-urasa-shirasa-drshtya-ashtanga.wav", "cat": "puja"}, {"id": 113, "slug": "pancayajnah", "title": "Pañcayajñāḥ", "chapter": "Pañcayajña — definition", "book_page": "202", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["ब्रह्मयज्ञो देवयज्ञः पितृयज्ञस्तथैव च ।", "भूतयज्ञो नृयज्ञश्च पञ्चयज्ञाः प्रकीर्तिताः ॥"], "iast": ["brahmayajño devayajñaḥ pitṛyajñastathaiva ca ।", "bhūtayajño nṛyajñaśca pañcayajñāḥ prakīrtitāḥ ॥"], "meaning": "The sacrifice to Brahman (Veda-study), the sacrifice to the gods, the sacrifice to the ancestors, the sacrifice to beings, and the sacrifice to human guests — these are proclaimed as the five (daily) sacrifices.", "action": "The verse enumerating the pañcayajñas — the five great daily sacrifices a householder owes and repays each day (study, offering to the gods, to the ancestors, to creatures, and hospitality to guests).", "audio": "audio/113-pancayajnah.wav", "cat": "japa"}, {"id": 114, "slug": "manojavam-marutatulyavegam", "title": "Manojavaṃ Mārutatulyavegaṃ (Hanumān)", "chapter": "Namaskāra — Hanumān śaraṇāgati", "book_page": "197", "meter": "upajāti", "tts_skip": false, "tts_note": "", "devanagari": ["मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम् ।", "वातात्मजं वानरयूथमुख्यं श्रीरामदूतं शरणं प्रपद्ये ॥"], "iast": ["manojavaṃ mārutatulyavegaṃ jitendriyaṃ buddhimatāṃ variṣṭham ।", "vātātmajaṃ vānarayūthamukhyaṃ śrīrāmadūtaṃ śaraṇaṃ prapadye ॥"], "meaning": "Swift as thought, equal in speed to the wind, master of the senses, foremost among the wise — the son of Vāyu, chief of the monkey host, the messenger of Śrī Rāma: in him I take refuge.", "action": "The well-known śaraṇāgati to Hanumān (Mukhyaprāṇa), recited as a salutation; here concluding the namaskāra-stuti at the close of worship.", "audio": "audio/114-manojavam-marutatulyavegam.wav", "cat": "puja"}, {"id": 115, "slug": "buddhirbalam-yasho-dhairyam", "title": "Buddhirbalaṃ Yaśo Dhairyaṃ", "chapter": "Namaskāra — Hanumān smaraṇa", "book_page": "198", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["बुद्धिर्बलं यशो धैर्यं निर्भयत्वमरोगता ।", "अजाड्यं वाक्पटुत्वं च हनूमत्स्मरणाद्भवेत् ॥"], "iast": ["buddhirbalaṃ yaśo dhairyaṃ nirbhayatvamarogatā ।", "ajāḍyaṃ vākpaṭutvaṃ ca hanūmatsmaraṇādbhavet ॥"], "meaning": "Intelligence, strength, fame, courage, fearlessness, freedom from disease, alertness of mind, and eloquence of speech — all these arise from remembering Hanumān.", "action": "Recited together with the previous verse as a salutation to Hanumān, declaring the fruits of his remembrance.", "audio": "audio/115-buddhirbalam-yasho-dhairyam.wav", "cat": "puja"}, {"id": 116, "slug": "shrimad-venkatanathaya", "title": "Śrīmadveṅkaṭanāthāya Śrīnivāsāya", "chapter": "Namaskāra — Veṅkaṭeśa", "book_page": "198", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["कल्याणाद्भुतगात्राय कामितार्थप्रदायिने ।", "श्रीमद्वेङ्कटनाथाय श्रीनिवासाय ते नमः ॥"], "iast": ["kalyāṇādbhutagātrāya kāmitārthapradāyine ।", "śrīmadveṅkaṭanāthāya śrīnivāsāya te namaḥ ॥"], "meaning": "To the one of auspicious and wondrous form, the granter of all desired ends — to the glorious Lord of Veṅkaṭa, to Śrīnivāsa, salutations to You.", "action": "A salutation to Lord Veṅkaṭeśa (Śrīnivāsa), recited within the namaskāra-stuti at the close of worship.", "audio": "audio/116-shrimad-venkatanathaya.wav", "cat": "puja"}, {"id": 117, "slug": "namo-namo-namo-namo-natosmi", "title": "Namo Namo Namo Namo Nato'smi", "chapter": "Namaskāra — Nārāyaṇa stuti", "book_page": "197", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["नमो नमो नमो नमो नतोऽस्मि ते सदा पदम् ।", "समस्तसद्गुणोच्छ्रितं नमामि ते पदं पुनः ॥"], "iast": ["namo namo namo namo nato'smi te sadā padam ।", "samastasadguṇocchritaṃ namāmi te padaṃ punaḥ ॥"], "meaning": "Salutations, salutations, salutations, salutations — I bow ever to Your feet. Again I bow to Your feet, exalted by the whole host of perfect qualities.", "action": "Part of the namaskāra-stuti recited at the close of worship — a repeated salutation to the Lord's feet.", "audio": "audio/117-namo-namo-namo-namo-natosmi.wav", "cat": "puja"}, {"id": 118, "slug": "svatantrayakhileshaya", "title": "Svatantrāyākhileśāya", "chapter": "Namaskāra — Nārāyaṇa stuti", "book_page": "197", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["स्वतन्त्रायाखिलेशाय निर्दोषगुणरूपिणे ।", "श्रेयसे मे सुपूर्णाय नमो नारायणाय ते ॥"], "iast": ["svatantrāyākhileśāya nirdoṣaguṇarūpiṇe ।", "śreyase me supūrṇāya namo nārāyaṇāya te ॥"], "meaning": "To the wholly independent one, the Lord of all, whose very form is flawless excellence; to the utterly complete one, the bestower of my highest good — to You, O Nārāyaṇa, salutations.", "action": "A salutation to Nārāyaṇa within the closing namaskāra-stuti, praising His independence (svātantrya) and flawless nature.", "audio": "audio/118-svatantrayakhileshaya.wav", "cat": "puja"}, {"id": 119, "slug": "namo-namaste-khilakaranaya", "title": "Namo Namaste'khilakāraṇāya", "chapter": "Namaskāra — Nārāyaṇa stuti", "book_page": "197", "meter": "upajāti", "tts_skip": false, "tts_note": "", "devanagari": ["नमो नमस्तेऽखिलकारणाय नारायणायार्तिविनाशनाय ।", "सर्वागमाम्नाय महार्णवाय नमोऽपवर्गाय परायणाय ॥"], "iast": ["namo namaste'khilakāraṇāya nārāyaṇāyārtivināśanāya ।", "sarvāgamāmnāya mahārṇavāya namo'pavargāya parāyaṇāya ॥"], "meaning": "Salutations, salutations to You — the cause of all, to Nārāyaṇa the destroyer of affliction; to the very tradition and canon of all scriptures, the great ocean; to the giver of liberation, the supreme refuge — salutations.", "action": "A salutation to Nārāyaṇa within the closing namaskāra-stuti, hailing Him as the cause of all and the bestower of liberation (apavarga).", "audio": "audio/119-namo-namaste-khilakaranaya.wav", "cat": "puja"}, {"id": 120, "slug": "matar-namami-kamale", "title": "Mātar Namāmi Kamale (Lakṣmī)", "chapter": "Namaskāra — Lakṣmī prārthanā", "book_page": "197", "meter": "vasantatilakā", "tts_skip": false, "tts_note": "", "devanagari": ["मातर्नमामि कमले कमलासनाद्यैर्देवैः पदाम्बुजयुगं तव सेन्द्ररुद्रैः ।", "आराधितं विविधभूरुहदिव्यपुष्पैर्मां रक्ष रक्ष वितरस्व ममेप्सितार्थान् ॥"], "iast": ["mātarnamāmi kamale kamalāsanādyairdevaiḥ padāmbujayugaṃ tava sendrarudraiḥ ।", "ārādhitaṃ vividhabhūruhadivyapuṣpairmāṃ rakṣa rakṣa vitarasva mamepsitārthān ॥"], "meaning": "O Mother, O lotus-dweller (Kamalā/Lakṣmī), I bow to Your two lotus-feet — worshipped by Brahmā (the lotus-seated) and the other gods, along with Indra and Rudra, with the divine flowers of many trees. Protect me, protect me, and grant me my desired ends.", "action": "A prayer to Lakṣmī within the closing namaskāra-stuti, bowing to her lotus-feet (themselves worshipped by Brahmā, Indra, Rudra and the gods) and asking her protection and the fulfilment of one's wishes.", "audio": "audio/120-matar-namami-kamale.wav", "cat": "puja"}, {"id": 121, "slug": "paramatmane-satatamekarupine", "title": "Paramātmane Satatamekarūpiṇe", "chapter": "Namaskāra — Nārāyaṇa stuti", "book_page": "197", "meter": "rucirā", "tts_skip": true, "tts_note": "Metre (rucirā, 13 syllables) is not in the vāgdhenu voice bank — text only.", "devanagari": ["परमात्मने सततमेकरूपिणे दशरूपिणे शतसहस्ररूपिणे ।", "अविकारिणे स्फुटमनन्तरूपिणे सुखचित्समस्ततनवे नमो नमः ॥"], "iast": ["paramātmane satatamekarūpiṇe daśarūpiṇe śatasahasrarūpiṇe ।", "avikāriṇe sphuṭamanantarūpiṇe sukhacitsamastatanave namo namaḥ ॥"], "meaning": "To the Supreme Self — ever one in form, yet of ten forms and of a hundred-thousand forms; to the changeless one whose forms are manifestly infinite, whose whole body is bliss-and-consciousness — salutations, salutations.", "action": "A salutation within the closing namaskāra-stuti, praising the Supreme Self as simultaneously one and of countless forms, His very being made of consciousness and bliss (sukha-cit).", "audio": null, "cat": "puja"}, {"id": 122, "slug": "matarme-matarishvan", "title": "Mātarme Mātariśvan (Hari Vāyu Stuti)", "chapter": "Namaskāra — Hari Vāyu Stuti", "book_page": "197", "meter": "sragdharā", "tts_skip": false, "tts_note": "", "devanagari": ["मातर्मे मातरिश्वन् पितरतुलगुरो भ्रातरिष्टाप्तबन्धो", "स्वामिन् सर्वान्तरात्मन्नजर जरयितर् जन्ममृत्यामयानाम् ।", "गोविन्दे देहि भक्तिं भवति च भगवन्नूर्जितां निर्निमित्तां", "निर्व्याजां निश्चलां सद्गुणगणबृहतीं शाश्वतीमाशु देव ॥"], "iast": ["mātarme mātariśvan pitaratulaguro bhrātariṣṭāptabandho", "svāmin sarvāntarātmann ajara jarayitar janmamṛtyāmayānām ।", "govinde dehi bhaktiṃ bhavati ca bhagavann ūrjitāṃ nirnimittāṃ", "nirvyājāṃ niścalāṃ sadguṇagaṇabṛhatīṃ śāśvatīmāśu deva ॥"], "meaning": "O my Mother, O Mātariśvan (Vāyu, Mukhyaprāṇa); O Father; O peerless Guru; O Brother; O dear and trusted Kinsman; O Master; O inner Self of all; O ageless one; O destroyer of the ailments of birth and death — grant me devotion to Govinda, and let it be, O Lord, ever-ascendant and strong, free of any motive, without guile, unwavering, vast with the host of good qualities, and eternal — grant it swiftly, O God.", "action": "The book's concluding verse of the namaskāra-stuti — this is **verse 14 of the Hari Vāyu Stuti** of Trivikrama Paṇḍitācārya, addressing Mukhyaprāṇa (Vāyu/Mātariśvan) as mother, father, guru, brother and kinsman, and praying through him for pure, causeless, unwavering, eternal devotion to Govinda. (Text confirmed against the authoritative Hari Vāyu Stuti; the book reproduces this verse.)", "audio": "audio/122-matarme-matarishvan.wav", "cat": "puja"}, {"id": 123, "slug": "sankshepa-tarpana", "title": "Saṅkṣepa Tarpaṇa", "chapter": "Pitṛyajña — abbreviated tarpaṇa", "book_page": "220", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["आ ब्रह्मस्तम्बपर्यन्तं यत्किञ्चित् सचराचरम् ।", "मया दत्तेन तोयेन तृप्तिमायान्तु पुष्कलम् ॥", "ये मे चास्मत्कुले जाता अपुत्रा गोत्रिणो मृताः ।", "ते गृह्णन्तु मया दत्तं वस्त्रनिष्पीडनोदकम् ॥", "येषां पिता न च भ्राता न पुत्रो नान्यगोत्रिणः ।", "ते सर्वे तृप्तिमायान्तु मयोत्सृष्टैः कुशैस्तथा ॥"], "iast": ["ā brahmastambaparyantaṃ yatkiñcit sacarācaram ।", "mayā dattena toyena tṛptimāyāntu puṣkalam ॥", "ye me cāsmatkule jātā aputrā gotriṇo mṛtāḥ ।", "te gṛhṇantu mayā dattaṃ vastraniṣpīḍanodakam ॥", "yeṣāṃ pitā na ca bhrātā na putro nānyagotriṇaḥ ।", "te sarve tṛptimāyāntu mayotsṛṣṭaiḥ kuśaistathā ॥"], "meaning": "May whatever exists, moving and unmoving, from Brahmā down to a blade of grass, attain full satisfaction by the water I offer. May those born in my family who have died without sons, of my lineage, receive the water wrung from my cloth that I offer. And those who have no father, no brother, no son, nor any other kinsman — may they all be satisfied by the kuśa-grass (and water) cast out by me.", "action": "The saṅkṣepa (abbreviated) tarpaṇa, recited by those unable to perform the full ancestor-offering — offering water for the satisfaction of all beings and of departed relatives who have no one to offer for them.", "audio": "audio/123-sankshepa-tarpana.wav", "cat": "japa"}, {"id": 124, "slug": "raurave-punyanilaye", "title": "Raurave Puṇyanilaye", "chapter": "Bhojana — water for all beings", "book_page": "240", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["रौरवे पुण्यनिलये पद्मार्बुदनिवासिनाम् ।", "अर्थिनामुदकं दत्तमक्षय्यमुपतिष्ठतु ॥"], "iast": ["raurave puṇyanilaye padmārbudanivāsinām ।", "arthināmudakaṃ dattamakṣayyamupatiṣṭhatu ॥"], "meaning": "For the supplicant beings dwelling in Raurava, in the realms of merit, and in (the regions called) Padma and Arbuda — may the water given (by me) abide inexhaustibly.", "action": "Recited during the meal while setting aside a little water/food, offering it for the sustenance of beings dwelling in all the worlds.", "audio": "audio/124-raurave-punyanilaye.wav", "cat": "close"}, {"id": 125, "slug": "idamannam-pavitram", "title": "Idamannaṃ Pavitraṃ Syāt", "chapter": "Bhojana — pādodaka", "book_page": "240", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["इदमन्नं पवित्रं स्यात्पानीयं चातिपावनम् ।", "भुक्तपीतविशुद्ध्यर्थं हरेः पादोदकं पिबेत् ॥"], "iast": ["idamannaṃ pavitraṃ syātpānīyaṃ cātipāvanam ।", "bhuktapītaviśuddhyarthaṃ hareḥ pādodakaṃ pibet ॥"], "meaning": "May this food be pure and this drink most purifying; for the purification of all that is eaten and drunk, one should sip the foot-water (pādodaka) of Hari.", "action": "Recited during the meal while sipping the Lord's pādodaka (tīrtha), to sanctify the food and drink.", "audio": "audio/125-idamannam-pavitram.wav", "cat": "close"}, {"id": 126, "slug": "agastir-madhavas-caiva", "title": "Agastirmādhavaścaiva (Sukhaśāyinaḥ)", "chapter": "Śayana — before sleep", "book_page": "242", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["अगस्तिर्माधवश्चैव मुचुकुन्दो महामुनिः ।", "कपिलो मुनिरास्तीकः पञ्चैते सुखशायिनः ॥"], "iast": ["agastirmādhavaścaiva mucukundo mahāmuniḥ ।", "kapilo munirāstīkaḥ pañcaite sukhaśāyinaḥ ॥"], "meaning": "Agastya, and Mādhava, Mucukunda the great sage, Kapila, and the sage Āstīka — these five are the ones who sleep in peace.", "action": "Recited at bedtime (śayana), remembering the five who 'sleep happily', as a prayer for undisturbed, peaceful sleep.", "audio": "audio/126-agastir-madhavas-caiva.wav", "cat": "close"}, {"id": 127, "slug": "ekadashy-upavasena", "title": "Ekādaśyupavāsena", "chapter": "Ekādaśī — pāraṇa samarpaṇa", "book_page": "244", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["एकादश्युपवासेन द्वादश्यां पारणेन च ।", "यदर्जितं मया पुण्यं तेन प्रीणातु केशवः ॥"], "iast": ["ekādaśyupavāsena dvādaśyāṃ pāraṇena ca ।", "yadarjitaṃ mayā puṇyaṃ tena prīṇātu keśavaḥ ॥"], "meaning": "By the merit I have earned through fasting on ekādaśī and breaking the fast on dvādaśī — by that, may Keśava be pleased.", "action": "Recited at the dvādaśī pāraṇa (breaking the ekādaśī fast), offering the merit of the observance to Keśava.", "audio": "audio/127-ekadashy-upavasena.wav", "cat": "close"}, {"id": 128, "slug": "hamsah-sucisat-prathama-arghya", "title": "Haṃsaḥ Śuciṣad (first noon arghya)", "chapter": "Sandhyāvandanam — Arghyapradānam (madhyāhnika)", "book_page": "32", "meter": "jagatī", "tts_skip": true, "tts_note": "Vedic mantra (recited with svara) — model can't reproduce intonation; audio sourced externally.", "devanagari": ["ओं हंसः शुचिषद्वसुरन्तरिक्षसद्धोता वेदिषदतिथिर्दुरोणसत् ।", "नृषद्वरसदृतसद्व्योमसदब्जा गोजा ऋतजा अद्रिजा ऋतम् । ओं ।"], "iast": ["oṃ haṃsaḥ śuciṣadvasurantarikṣasaddhotā vediṣadatithirduroṇasat ।", "nṛṣadvarasadṛtasadvyomasadabjā gojā ṛtajā adrijā ṛtam । oṃ ।"], "meaning": "He (the sun, the haṃsa) sits in radiant purity; the Vasu, he sits in mid-air; the Hotṛ, he sits at the altar; the guest, he sits in the house. Sitting among men, sitting in the choicest place, sitting in the true, sitting in the sky — born of the waters, born of light, born of ṛta, born of the mountain — he is the truth.", "action": "The first of the three madhyāhna sūryārghya mantras (Ṛgvedic). The three arghyas of the noon sandhyā are offered with (1) this *haṃsaḥ śuciṣad* verse, (2) *ā kṛṣṇena rajasā* (shloka 038), and (3) the Gāyatrī mantra. Viniyoga: *haṃsaḥ śuciṣadityasya mantrasya gautamo vāmadeva ṛṣiḥ; jagatī chandaḥ; sūryo devatā; mādhyāhnikasandhyāṅgasūryārghyapradāne viniyogaḥ.*", "audio": null, "cat": "sandhya"}, {"id": 129, "slug": "gayatri-visarjana-uttistha-devi", "title": "Gāyatrī Visarjana — Uttiṣṭha Devi", "chapter": "Sandhyāvandanam — Gāyatryākarṣaṇam", "book_page": "36", "meter": "anuṣṭubh", "tts_skip": false, "tts_note": "", "devanagari": ["उत्तिष्ठ देवि गन्तव्यं पुनरागमनाय च ।", "गायत्री च महादेवि प्रविश्य हृदयं मम ॥", "असावादित्यो ब्रह्म ।"], "iast": ["uttiṣṭha devi gantavyaṃ punarāgamanāya ca ।", "gāyatrī ca mahādevi praviśya hṛdayaṃ mama ॥", "asāvādityo brahma ।"], "meaning": "Arise, O Goddess, you may now depart, to come again (at the next sandhyā). O great Goddess Gāyatrī, having entered my heart (may you remain there). That sun yonder is Brahman.", "action": "Recited immediately after the Gāyatryākarṣaṇa mantra (*prati cakṣva*, shloka 042), bidding the Goddess Gāyatrī leave the external oblation-water and abide in the heart. Followed by repeating the *oṃ āpo jyotī rasaḥ...bhūrbhuvaḥsvarom* formula (shloka 033), after which one sprinkles/circumambulates oneself with the water (*iti jalena ātmānaṃ pradakṣiṇaṃ kuryāt*) and does ācamana twice.", "audio": "audio/129-gayatri-visarjana-uttistha-devi.wav", "cat": "sandhya"}, {"id": 130, "slug": "devatarghya-tarpana-madhyahna", "title": "Devatārghya Tarpaṇa — Dvādaśāditya (madhyāhna)", "chapter": "Sandhyāvandanam — Devatārghyam", "book_page": "39", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं धातारं तर्पयामि । ओं अर्यमणं तर्पयामि । ओं मित्रं तर्पयामि ।", "ओं वरुणं तर्पयामि । ओं अंशुं तर्पयामि । ओं भगं तर्पयामि ।", "ओं इन्द्रं तर्पयामि । ओं विवस्वन्तं तर्पयामि । ओं पूषाणं तर्पयामि ।", "ओं त्वष्टारं तर्पयामि । ओं पर्जन्यं तर्पयामि । ओं विष्णुं तर्पयामि ।"], "iast": ["oṃ dhātāraṃ tarpayāmi । oṃ aryamaṇaṃ tarpayāmi । oṃ mitraṃ tarpayāmi ।", "oṃ varuṇaṃ tarpayāmi । oṃ aṃśuṃ tarpayāmi । oṃ bhagaṃ tarpayāmi ।", "oṃ indraṃ tarpayāmi । oṃ vivasvantaṃ tarpayāmi । oṃ pūṣāṇaṃ tarpayāmi ।", "oṃ tvaṣṭāraṃ tarpayāmi । oṃ parjanyaṃ tarpayāmi । oṃ viṣṇuṃ tarpayāmi ।"], "meaning": "I offer tarpaṇa to Dhātṛ, Aryaman, Mitra, Varuṇa, Aṃśa, Bhaga, Indra, Vivasvān, Pūṣan, Tvaṣṭṛ, Parjanya and Viṣṇu — the twelve Ādityas.", "action": "The noon (madhyāhna) devatārghya-tarpaṇa: the twelve Ādityas are worshipped by name, pouring water with the ring finger, middle finger and forefinger — parallel to the bright-fortnight Keśavādi list (shloka 044) and dark-fortnight Saṅkarṣaṇādi list (shloka 045) offered at the morning sandhyā. Followed by ācamana twice. (On ekādaśī day, this noon tarpaṇa is done with the Keśavādi names instead.)", "audio": "audio/130-devatarghya-tarpana-madhyahna.wav", "cat": "sandhya"}, {"id": 131, "slug": "papapurusa-nasana-caturvyuha", "title": "Pāpapuruṣa-nāśana (Caturvyūha Bhūtaśuddhi)", "chapter": "Sandhyāvandanam — Pāpapuruṣadhyānam", "book_page": "46", "meter": "gadya", "tts_skip": false, "tts_note": "", "devanagari": ["ओं यं (नाभौ) षट्कोणमण्डलमध्यस्थो नीलवर्णो वाय्वन्तर्गतः श्री प्रद्युम्नो भगवान् मच्छरीरस्थं पापपुरुषं वायुना शोषयतु । ओं यं ।", "ओं रं (हृदये) त्रिकोणमण्डलमध्यस्थो रक्तवर्णो वह्न्यन्तर्गतश्रीमदनिरुद्धो भगवान् मच्छरीरस्थं पापपुरुषं वह्निना निर्दहतु । ओं रं ।", "नासाग्रस्थः सङ्कर्षणो भगवान् मच्छरीरस्थितदग्धपापपुरुषस्य भस्म निःसारयतु ।", "ओं वं (शिरसि) वर्तुलमण्डलमध्यस्थः श्वेतवर्णो वरुणान्तर्गतः श्रीवासुदेवो भगवान् मच्छरीरममृतवृष्ट्याऽऽप्लावयतु । ओं वं ।"], "iast": ["oṃ yaṃ (nābhau) ṣaṭkoṇamaṇḍalamadhyastho nīlavarṇo vāyvantargataḥ śrī pradyumno bhagavān maccharīrasthaṃ pāpapuruṣaṃ vāyunā śoṣayatu । oṃ yaṃ ।", "oṃ raṃ (hṛdaye) trikoṇamaṇḍalamadhyastho raktavarṇo vahnyantargataśrīmadaniruddho bhagavān maccharīrasthaṃ pāpapuruṣaṃ vahninā nirdahatu । oṃ raṃ ।", "nāsāgrasthaḥ saṅkarṣaṇo bhagavān maccharīrasthitadagdhapāpapuruṣasya bhasma niḥsārayatu ।", "oṃ vaṃ (śirasi) vartulamaṇḍalamadhyasthaḥ śvetavarṇo varuṇāntargataḥ śrīvāsudevo bhagavān maccharīramamṛtavṛṣṭyā''plāvayatu । oṃ vaṃ ।"], "meaning": "Oṃ yaṃ — Lord Pradyumna, dark-blue, seated within a hexagonal maṇḍala at the navel, abiding in the wind — may He dry up, by the wind, the sin-person (pāpapuruṣa) lodged in my body. Oṃ raṃ — Lord Aniruddha, red, seated within a triangular maṇḍala at the heart, abiding in fire — may He burn up, by fire, the sin-person lodged in my body. May Lord Saṅkarṣaṇa, at the tip of the nose, expel the ashes of the now-burnt sin-person lodged in my body. Oṃ vaṃ — Lord Vāsudeva, white, seated within a round maṇḍala at the head, abiding in Varuṇa (the waters) — may He flood my body with a shower of nectar.", "action": "The Caturvyūha bhūtaśuddhi, continuing the Pāpapuruṣa-dhyāna (shloka 055): the sin-person visualized in the belly is dried by Pradyumna/vāyu (*oṃ yaṃ*, uttered 6 times), burnt by Aniruddha/agni (*oṃ raṃ*, uttered 12 times), its ashes expelled through the left nostril by Saṅkarṣaṇa at the nose-tip, and the body then flooded with nectar by Vāsudeva/Varuṇa (*oṃ vaṃ*, uttered 24 times).", "audio": "audio/131-papapurusa-nasana-caturvyuha.wav", "cat": "sandhya"}];
const CATEGORIES = [{"id": "morning", "label": "Morning Rituals"}, {"id": "sandhya", "label": "Sandhyāvandanam"}, {"id": "japa", "label": "Daily Japa & Duties"}, {"id": "puja", "label": "Deity Pūjā"}, {"id": "sukta", "label": "Vedic Sūktas"}, {"id": "festival", "label": "Festivals"}, {"id": "close", "label": "Meals & Rest"}];
const list = document.getElementById('list');
const stat = document.getElementById('stat');
const q = document.getElementById('q');
const jump = document.getElementById('jump');
const catbar = document.getElementById('catbar');
const BASE_TITLE = document.title;

// category bar: "All" + each category, each a real link (#cat=id) so it's a shareable,
// back-button-friendly URL that shows only that category's cards.
function catCount(id){ return DATA.filter(d => id ? d.cat===id : true).length; }
function hashCat(){ const m = location.hash.match(/cat=([a-z]+)/); return m ? m[1] : null; }
let catFilter = hashCat();

function renderCatbar(){
  catbar.innerHTML = '';
  const tabs = [{id:null, label:'All'}, ...CATEGORIES];
  for (const t of tabs){
    const a = document.createElement('a');
    a.className = 'cattab' + (catFilter===t.id ? ' active' : '');
    a.href = t.id ? ('#cat='+t.id) : '#';
    a.innerHTML = esc(t.label) + ' <span class="n">' + catCount(t.id) + '</span>';
    catbar.appendChild(a);
  }
}
function applyCatTitle(){
  const label = CATEGORIES.find(c=>c.id===catFilter)?.label;
  document.title = label ? (label + ' — ' + BASE_TITLE) : BASE_TITLE;
}
window.addEventListener('hashchange', ()=>{
  catFilter = hashCat();
  applyCatTitle();
  window.scrollTo(0,0);
  renderCatbar();
  render(q.value);
});

// stable chapter -> anchor-id map, in book order
const chapters = [];
const chapterId = {};
for (const d of DATA){ if (!(d.chapter in chapterId)){ chapterId[d.chapter] = 'ch-' + chapters.length; chapters.push(d.chapter); } }
// group dropdown options by major section (text before the first em-dash)
let curGroup = null, groupEl = null;
for (const ch of chapters){
  const major = ch.split('—')[0].trim() || ch;
  if (major !== curGroup){ groupEl = document.createElement('optgroup'); groupEl.label = major; jump.appendChild(groupEl); curGroup = major; }
  const sub = ch.includes('—') ? ch.split('—').slice(1).join('—').trim() : ch;
  const o = document.createElement('option'); o.value = chapterId[ch]; o.textContent = sub || ch; groupEl.appendChild(o);
}

function statusOf(d){ return d.audio ? 'audio' : (d.tts_skip ? 'external' : 'render'); }
const PILL = {audio:'♪ audio', render:'⏳ to render', external:'external'};
let stFilter = 'all';
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(s){
  // lightweight markdown for meaning/action: strip leading blockquote, **bold**, *italic*
  s = (s||'').replace(/^\s*>\s?/gm, '');
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\n+/g, '<br>');
  return s;
}

function render(filter){
  filter = (filter||'').trim().toLowerCase();
  list.innerHTML = '';
  let shown = 0, lastChap = null;
  for (const d of DATA){
    if (catFilter && d.cat !== catFilter) continue;
    const st = statusOf(d);
    if (stFilter !== 'all' && st !== stFilter) continue;
    const hay = (d.title+' '+d.chapter+' '+d.meaning+' '+d.action+' '+d.devanagari.join(' ')+' '+d.iast.join(' ')).toLowerCase();
    if (filter && !hay.includes(filter)) continue;
    shown++;
    if (d.chapter !== lastChap){
      const h = document.createElement('div'); h.className='chapter'; h.id=chapterId[d.chapter]; h.textContent=d.chapter; list.appendChild(h); lastChap=d.chapter;
    }
    const c = document.createElement('div'); c.className='card';
    let audioHtml;
    if (d.audio) audioHtml = `<audio controls preload="none" src="${d.audio}"></audio>`;
    else if (d.tts_skip) audioHtml = `<div class="noaudio">${esc(d.tts_note || 'Vedic sūkta — audio sourced separately (model does not render svara).')}</div>`;
    else audioHtml = `<div class="noaudio">Audio not yet rendered.</div>`;
    c.innerHTML =
      `<div class="card-head"><span class="num">#${String(d.id).padStart(3,'0')}</span>`+
      `<span class="title">${esc(d.title)}</span>`+
      `<span class="pill ${st}">${PILL[st]}</span>`+
      (d.meter?`<span class="badge">${esc(d.meter)}</span>`:'')+
      (d.book_page?`<span class="badge">p${esc(d.book_page)}</span>`:'')+`</div>`+
      `<div class="dev">${d.devanagari.map(esc).join('<br>')}</div>`+
      `<div class="iast">${d.iast.map(esc).join('<br>')}</div>`+
      `<div class="label">Meaning</div><div class="meaning">${fmt(d.meaning)}</div>`+
      (d.action?`<div class="label">While reciting</div><div class="action">${fmt(d.action)}</div>`:'')+
      audioHtml;
    list.appendChild(c);
  }
  const scope = catFilter ? DATA.filter(d=>d.cat===catFilter) : DATA;
  const nA = scope.filter(d=>statusOf(d)==='audio').length;
  const nR = scope.filter(d=>statusOf(d)==='render').length;
  const nE = scope.filter(d=>statusOf(d)==='external').length;
  const catLabel = CATEGORIES.find(c=>c.id===catFilter)?.label;
  stat.textContent = (catLabel ? `${catLabel} — ` : '') +
    `${scope.length} shlokas · ${nA} with audio · ${nR} to render · ${nE} external/text-only`
    + (filter||stFilter!=='all' ? `  —  showing ${shown}` : '');
}
q.addEventListener('input', e=>render(e.target.value));
document.getElementById('printBtn').addEventListener('click', ()=>window.print());
document.getElementById('chips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip || chip.id==='printBtn') return;
  stFilter = chip.dataset.st;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c===chip));
  render(q.value);
});
jump.addEventListener('change', e=>{
  const id = e.target.value; if(!id) return;
  let needsRender = false;
  if (q.value){ q.value=''; needsRender = true; }              // clear any active search
  if (catFilter){ history.replaceState(null,'',location.pathname+location.search); catFilter=null; renderCatbar(); applyCatTitle(); needsRender = true; } // clear any active category
  if (needsRender) render('');
  const el = document.getElementById(id);
  if (el){ const top = el.getBoundingClientRect().top + window.scrollY - 84; window.scrollTo({top, behavior:'smooth'}); }
  e.target.selectedIndex = 0;                   // reset back to placeholder
});
applyCatTitle();
renderCatbar();
render('');
</script>
</body>
</html>
